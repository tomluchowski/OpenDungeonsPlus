# Part tint test file: a palette of three pure colours, so the result of a tinted solid part is exactly one
# of them. Same format as ../../../config/dungeonbook-part-tints.cfg.

[Palette]
Name	primary
Colour	red	0	1	1
Colour	green	120	1	1
Colour	blue	240	1	1

[Palette]
Name	blue
Colour	blue	240	1	1

[Portrait]
Mesh	hair
Region	Hair	palette=primary	box=0,0,1,1	hue=0,360	sat=0,1	val=0,1

[Portrait]
Mesh	chin:forked
Region	Hair	palette=primary	box=0,0,1,1	hue=0,360	sat=0,1	val=0,1

[Portrait]
Mesh	eyes:round
Region	Eyes	palette=primary	box=0,0,1,1	hue=0,360	sat=0,1	val=0,1

# Eyes of one catalog id: an 8x1 part, the ellipse covers its left half (centre 0.25, 0.5, radii 0.2 of the width)
[Portrait]
Mesh	Knight.mesh-male:eyes:narrow
Region	Eyes	palette=primary	ellipse=0.25,0.5,0.2,0.2	hue=0,360	sat=0,1	val=0,1

# Skin amplitude for bases that come without one
[Portrait]
Mesh	base-skin
Region	Skin	shift=6,0.12,0.12	box=0,0,1,1	hue=0,360	sat=0,1	val=0,1

# A block of one catalog id replaces the generic hair block for that option: always blue
[Portrait]
Mesh	Knight.mesh-male:hair:braid
Region	Hair	palette=blue	box=0,0,1,1	hue=0,360	sat=0,1	val=0,1
