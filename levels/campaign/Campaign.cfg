# Campaign level sequence. Levels are played in this order; a level is
# unlocked when all levels before it are completed.
#
# [Level]       starts a new level entry
# File          level file, relative to the "levels" directory
# Title         name shown in the campaign menu
# Briefing      text shown before the level (\n starts a new line)
# Debriefing    text shown after the level was won
# Preview       optional briefing image, relative to gui/campaign/
# Province      province or bonus site of the level on the world map
#               (gui/campaign/campaign-world.json). Optional; levels without
#               it are not shown on the map.
# Branch        province of the branch sister (both sisters name each other and
#               follow each other): completing one unlocks the levels after
#               them, the other stays playable. Optional.
# Warden        ruler of the province, shown in its tooltip. Optional.
# Difficulty    1 (easy) to 5, shown in the tooltip. Optional.

[Level]
File=campaign/Mossgate.level
Province=T01
Preview=previews/T01.png
Warden=Reeve Tobin Marsh
Difficulty=1
Title=Mossgate
Briefing=Master, High King Castellan orders Mossgate to crush your new heart; Prince Aurel laughs at the alarm.\n\nHis throne at Hollowmark is our prize, but Reeve Tobin Marsh guards this mossy village first. Mine the soft walls and claim the meadow cave.\n\nBreak the watch post and slay the reeve in his hall.
Debriefing=Mossgate is yours, Master, and Aurel's laughter stops when the messenger names the dead reeve. Castellan orders Brackenford to hold.

[Level]
File=campaign/Brackenford.level
Province=T02
Preview=previews/T02.png
Warden=Warden Elsa Brack
Difficulty=1
Title=Brackenford
Briefing=My lord, Aurel promises Elsa Brack that Brackenford's shallow ford will swallow you.\n\nCastellan wants proof, and her keep waits across the fern-lined banks. Build beds and a hatchery, claim the grove and gather your creatures.\n\nCross the ford and kill the warden in her keep.
Debriefing=Brack is dead and the ford is yours. Castellan demands an account; Aurel blames the warden and points to Coldwell.

[Level]
File=campaign/Coldwell.level
Province=T03
Preview=previews/T03.png
Warden=Warden Hugo Cole
Difficulty=1
Title=Coldwell
Briefing=Master, Castellan's order lies on Hugo Cole's table: shut Coldwell's north gate.\n\nAurel promises that this well-fed keep will end our march. Take the old well plaza and mine the gold beneath it to raise your army.\n\nBreak the north gate and slay Cole in his hall.
Debriefing=Cole is dead and Coldwell stands open. Aurel's promised victory becomes another report for Castellan's silent council.

[Level]
File=campaign/Tinmoor.level
Province=T04
Preview=previews/T04.png
Warden=Warden Merrin Tay
Difficulty=2
Title=Tinmoor
Briefing=My lord, Aurel urges Merrin Tay to choke our advance in Tinmoor's mine galleries.\n\nMine the seams, break both watch posts and kill her in the upper chamber. A sealed vault may hold a stone to carry home and reveal an optional trial.\n\nCastellan is counting fallen wardens now.
Debriefing=Tay is dead and the mine is yours. Castellan demands that Ravensledge stop the march Aurel promised to end.

[Level]
File=campaign/BoulderCourse.level
Province=B01
Preview=previews/B01.png
Bonus=1
Warden=Foreman Bram Tull
Difficulty=2
Title=The Boulder Course
Briefing=Master, Tinmoor's hidden stone has revealed the old boulder course. Foreman Bram Tull's mine crew left four balls and four cups in these galleries. Roll every ball into its cup before the shift bell; this optional trial rewards one of four Heartstone fragments. Aurel trusts strength alone, but this hall asks for aim.
Debriefing=Every boulder rests in its cup, and this trial's Heartstone fragment is earned. Our road toward Castellan's throne still leads through Ravensledge.

[Level]
File=campaign/Ravensledge.level
Province=T05
Preview=previews/T05.png
Warden=Captain Osric Vane
Difficulty=2
Title=Ravensledge
Briefing=My lord, Aurel's message boasts that Ravensledge cannot fall.\n\nCaptain Osric Vane watches from the highest of three cliff shelves, with archers above the narrow crossings. Secure your bridgeheads and climb shelf by shelf.\n\nSlay him in the highest keep and send Castellan another answer.
Debriefing=Vane is dead and Ravensledge is yours. Castellan reads of the fallen heights while Aurel turns his hopes toward Ashcombe.

[Level]
File=campaign/Ashcombe.level
Province=T06
Preview=previews/T06.png
Warden=Warden Liesl Ashby
Difficulty=2
Title=Ashcombe
Briefing=Master, Castellan demands that Liesl Ashby survive; Aurel calls her flight prudence.\n\nHer wagons are being prepared at the northern hold above Ashcombe's smoking basin. Cross the ashes and kill her before she escapes, whether in the hold or on the south road.\n\nThe court must hear that flight failed too.
Debriefing=Ashby is dead and her escape has failed. Aurel cannot disguise this loss, and Castellan's warning travels to Greywater.

[Level]
File=campaign/Greywater.level
Province=T07
Preview=previews/T07.png
Warden=Warden Corwin Gray
Difficulty=2
Title=Greywater
Briefing=My lord, Castellan's warning reaches Corwin Gray's hall on Greywater's underground river.\n\nYou have no gold, while the town's heroes besiege another keeper across the water. Mine first and protect your heart, for those heroes may turn on you.\n\nKill Gray in his river hall before Aurel's hopes become our burial.
Debriefing=Gray is dead and Greywater is yours. Aurel calls for harsher resistance; Castellan looks to Hollin Fen's convent.

[Level]
File=campaign/HollinFen.level
Province=T08
Preview=previews/T08.png
Warden=Sister Agathe Hollin
Difficulty=3
Title=Hollin Fen
Briefing=Master, Aurel praises Agathe Hollin's tireless patrols through the holly bog.\n\nBuild your dungeon, hold your heart and break the convent ward to kill her in the chapel. A pale stone behind a bricked hollow may reveal an optional trial if carried home.\n\nCastellan has ordered good news this time.
Debriefing=Agathe is dead and her chapel is silent. Castellan receives no good news; Aurel warns that neither outer route will save you.

[Level]
File=campaign/CrowshotGallery.level
Province=B02
Preview=previews/B02.png
Bonus=1
Warden=Gallery Keeper Wren
Difficulty=2
Title=The Crowshot Gallery
Briefing=My lord, Hollin Fen's hidden stone opens Gallery Keeper Wren's old shooting gallery. Hornets now circle its islets above a lava lake. Possess a shooter and destroy every hornet before time expires to earn this optional trial's Heartstone fragment. Let Aurel keep his threats while you sharpen your aim.
Debriefing=The hornets are gone and this trial's Heartstone fragment is earned. The main advance offers Saltmere or Dunmarrow, whichever road you choose.

[Level]
File=campaign/Saltmere.level
Province=T09A
Preview=previews/T09A.png
Branch=T09B
Warden=Admiral Bram Seward
Difficulty=3
Title=Saltmere
Briefing=My lord, Castellan orders Admiral Bram Seward to hold Saltmere, the kingdom's sea door.\n\nMine the salt walls and cross the white flats and green lagoons to his southern harbour. Protect your heart while the heroes threaten the sleeping keeper nearby as well.\n\nKill Seward and answer Aurel's boast that no route reaches the inner realm.
Debriefing=Seward is dead and the chosen outer route is yours. Aurel demands weapons from Ironbridge; Castellan's defences draw inward.

[Level]
File=campaign/Dunmarrow.level
Province=T09B
Preview=previews/T09B.png
Branch=T09A
Warden=Warden Ysolde Dunn
Difficulty=3
Title=Dunmarrow
Briefing=Master, Castellan orders Ysolde Dunn to preserve herself among Dunmarrow's dunes.\n\nHer wagons wait above old barrows, and she will escape through the old shaft if you delay. Use the buried tunnels to reach her and kill her before she gets away.\n\nAurel boasts that no route reaches the inner realm.
Debriefing=Dunn is dead and the chosen outer route is yours. Aurel demands weapons from Ironbridge; Castellan's defences draw inward.

[Level]
File=campaign/Ironbridge.level
Province=T10
Preview=previews/T10.png
Warden=Warden Gareth Fenn
Difficulty=3
Title=Ironbridge
Briefing=My lord, our chosen outer route has brought us to Ironbridge's forges.\n\nAurel demands weapons from Gareth Fenn, but three molten rifts stand between us and the northern hold. Build your strength and take the guarded stone bridges one by one.\n\nDestroy the rival heart in the north-east and deny Castellan this defence.
Debriefing=The rival heart is dark and Ironbridge is yours. Aurel has lost his promised shield; Castellan turns to Wolfscar's hunters.

[Level]
File=campaign/Wolfscar.level
Province=T11
Preview=previews/T11.png
Warden=Huntmaster Rolf Scarrow
Difficulty=3
Title=Wolfscar
Briefing=Master, Castellan counts on the hunting keepers of Rolf Scarrow's Wolfscar.\n\nFour rival hearts stand beyond two forest ravines, and their packs will join against you. Cross the stone bridges, seize the wolf den and destroy every rival heart while guarding your own.\n\nLet Aurel learn how few allies remain.
Debriefing=Every rival heart is dark and Wolfscar is yours. Aurel orders Lanternhill's lamps kept burning as a warning.

[Level]
File=campaign/Lanternhill.level
Province=T12
Preview=previews/T12.png
Warden=Lamplighter Ines Vale
Difficulty=3
Title=Lanternhill
Briefing=Master, Aurel swears that Lanternhill's lamps will mark the end of your road.\n\nMine the seams, dig through the ring road's earth plugs and withstand the kingdom's patrols. Destroy the northern rival heart beneath Ines Vale's lamps.\n\nA pale stone hidden in the hill may reveal another optional trial when carried home.
Debriefing=The rival heart is cold and Lanternhill lights your road. Castellan demands a siege, and Aurel promises victory before dawn.

[Level]
File=campaign/TwistingHalls.level
Province=B03
Preview=previews/B03.png
Bonus=1
Warden=Lamp Warden Oswin
Difficulty=3
Title=The Twisting Halls
Briefing=My lord, Lanternhill's hidden stone reveals Lamp Warden Oswin's twisting halls. Their lamps shine over traps, moats and a distant exit. Possess your own creature and reach the north-east exit before time runs out to earn this optional trial's Heartstone fragment. Aurel's threats are loud; here, keep your nerve quiet.
Debriefing=The exit is reached and this trial's Heartstone fragment is earned. Cinderhollow awaits on the main road toward Castellan.

[Level]
File=campaign/Cinderhollow.level
Province=T13
Preview=previews/T13.png
Warden=Warden Pell Ashgrove
Difficulty=4
Title=Cinderhollow
Briefing=My lord, Aurel has promised Castellan your heart before dawn at Cinderhollow.\n\nPell Ashgrove's heroes descend into the black crater in three waves while a rival holds the north-east rim. Mine the seams and defend your heart until dawn.\n\nThen cross the lava bridge and destroy the rival heart.
Debriefing=The siege failed and the rival heart is dark. Aurel answers Castellan with anger, while Thornreach becomes the next barrier.

[Level]
File=campaign/Thornreach.level
Province=T14
Preview=previews/T14.png
Warden=Warden Cassia Thorne
Difficulty=4
Title=Thornreach
Briefing=My lord, Castellan trusts Cassia Thorne's hedge maze to entangle our advance.\n\nFour rival keepers hold its corners and fight one another as readily as they fight you. Take the middle clearing, cut through the maze and destroy every rival heart.\n\nAurel is watching another barrier he swore would hold.
Debriefing=The four rival hearts are dark and Thornreach is yours. Castellan asks Bellwick's faithful to stop the march.

[Level]
File=campaign/Bellwick.level
Province=T15
Preview=previews/T15.png
Warden=Abbot Lorens Bell
Difficulty=4
Title=Bellwick
Briefing=Master, Castellan's appeal reaches Bellwick beneath the abbey's tolling bells.\n\nAbbot Lorens Bell calls the faithful while an undead keeper stirs below the nave. Hold against the faithful until the north gates unseal, then destroy the undercroft heart.\n\nAurel waits for those bells to announce your defeat.
Debriefing=The undead heart is dark and Bellwick's bells are silent. Aurel hears no victory, and Castellan looks to Highcairn's heights.

[Level]
File=campaign/Highcairn.level
Province=T16
Preview=previews/T16.png
Warden=Warden Hilde Cairn
Difficulty=4
Title=Highcairn
Briefing=My lord, Aurel boasts that Hilde Cairn's grave terraces will end the climb.\n\nBuild from your workers, guard your heart and ascend toward her mountain hold. Kill the warden, and carry the cairn spirit's pale stone home if you discover its hidden hall.\n\nThat optional trial offers strength, but Castellan's throne remains our goal.
Debriefing=Cairn is dead and the mountain hold is yours. Castellan's warning reaches Stormhaven; Aurel has fewer walls left to praise.

[Level]
File=campaign/SkittleCavern.level
Province=B04
Preview=previews/B04.png
Bonus=1
Warden=Cairnkeeper Hald
Difficulty=2
Title=The Skittle Cavern
Briefing=Master, Highcairn's hidden stone reveals Cairnkeeper Hald's vaulted boulder lanes. Opening their earth plugs brings ten standing guards to their marks. Roll the boulders through every guard before time expires to earn this optional trial's Heartstone fragment. Castellan trusts guards too; show how readily a line can fall.
Debriefing=The guards are down and this trial's fragment is earned; all four fragments together complete the Heartstone and unlock Summon Champion. Stormhaven awaits.

[Level]
File=campaign/Stormhaven.level
Province=T17
Preview=previews/T17.png
Warden=Captain Ivo Strand
Difficulty=4
Title=Stormhaven
Briefing=Master, Castellan insists that Ivo Strand's harbour must hold.\n\nStormhaven's four rival keepers quarrel across a black inlet, but they will lend one another soldiers against you. Control the stone spans and destroy every rival heart.\n\nAurel will find no refuge in their quarrel.
Debriefing=All four rival hearts are dark and Stormhaven is yours. Castellan's inner defence offers two roads: Mirewatch or Goldspire.

[Level]
File=campaign/Mirewatch.level
Province=T18A
Preview=previews/T18A.png
Branch=T18B
Warden=Watcher Mora Fenwick
Difficulty=4
Title=Mirewatch
Briefing=My lord, Aurel calls Mirewatch's eight beacons the court's warning line.\n\nYou have only workers, so dig and build before crossing the black-water causeways. Take the towers and secure both sealed approaches to Mora Fenwick's last tower.\n\nKill the watcher and bring this chosen barrier down.
Debriefing=Fenwick is dead and the chosen inner barrier has fallen. Castellan sends his hopes into Ebonrook; Aurel begins preparing his own stand.

[Level]
File=campaign/Goldspire.level
Province=T18B
Preview=previews/T18B.png
Branch=T18A
Warden=Treasurer Alaric Penn
Difficulty=4
Title=Goldspire
Briefing=Master, Castellan orders Alaric Penn to defend the realm's coin in Goldspire.\n\nWith workers and a thin purse, build before challenging the garrison below its rings. Take the low town, work through the sealed links and kill the treasurer in the core.\n\nAurel cannot hold this chosen barrier with promises.
Debriefing=Penn is dead and the chosen inner barrier has fallen. Castellan sends his hopes into Ebonrook; Aurel begins preparing his own stand.

[Level]
File=campaign/Ebonrook.level
Province=T19
Preview=previews/T19.png
Warden=Warden Sabine Rook
Difficulty=5
Title=Ebonrook
Briefing=My lord, Castellan urges Sabine Rook to bury your army beneath Ebonrook's black roots.\n\nYou have creatures but no gold, so mine the glades and keep them fed. Cross the northern bridges, open the southern approaches and kill Rook in the south-west roots.\n\nBeyond this wood, Aurel is gathering his court.
Debriefing=Rook is dead and Ebonrook is yours. Aurel insists Varn's Crossing will halt you before the roads reach the capital.

[Level]
File=campaign/VarnsCrossing.level
Province=T20
Preview=previews/T20.png
Warden=Marshal Varn
Difficulty=5
Title=Varn's Crossing
Briefing=Master, Aurel promises that Marshal Varn's crossing will halt our march.\n\nHeroes stream down four roads while two rival keepers contest the lava-ringed fortress. Claim your quarter, hold the fortress and protect your heart as you destroy both rival hearts.\n\nCastellan must hear whose banner now watches those roads.
Debriefing=Both rival hearts are dark and the crossing is yours. Castellan's capital draws closer; an optional night siege is also revealed.

[Level]
File=campaign/SwarmNight.level
Province=B05
Preview=previews/B05.png
Bonus=1
Heartstone=0
Warden=Night Reeve Sable
Difficulty=3
Title=The Swarm Night
Briefing=My lord, this optional detour tests your dungeon through the long Swarm Night. Night Reeve Sable's rival keeper works beyond your halls while swarms press your guards. Keep your heart standing for thirteen minutes. Your strongest surviving fighter can follow you onward toward Aurel's stand; this trial grants no Heartstone fragment.
Debriefing=The night is survived and your strongest fighter will follow you to the next land. Silverdeep remains the main road toward the court.

[Level]
File=campaign/Silverdeep.level
Province=T21
Preview=previews/T21.png
Warden=Warden Dorian Silt
Difficulty=5
Title=Silverdeep
Briefing=My lord, Castellan demands that Dorian Silt's silver mines deny us another road.\n\nYou arrive without gold, so mine first and build your force. Bridge three deep lakes with wooden spans and destroy all three rival hearts before their pacts overwhelm you.\n\nAurel is gathering his court as these last rivals fall.
Debriefing=The three rival hearts are dark and Silverdeep is yours. Aurel sends one last warning from Kingsfall while Wraithwood hides another alliance.

[Level]
File=campaign/Wraithwood.level
Province=T22
Preview=previews/T22.png
Warden=Witch-Warden Elowen Ash
Difficulty=5
Title=Wraithwood
Briefing=Master, Aurel's final threat comes from Kingsfall while Wraithwood's grey trunks vanish into fog.\n\nElowen Ash's heart stands in the north-west and her allied rival's on the north-eastern rim. Defend against the kingdom's heroes and destroy both hearts.\n\nCastellan waits behind his courts, but his prince must answer first.
Debriefing=Both hearts are dark and Wraithwood is yours. Aurel can threaten us by messenger no longer; his hunting grounds await.

[Level]
File=campaign/Kingsfall.level
Province=T23
Preview=previews/T23.png
Warden=Prince Aurel
Difficulty=5
Title=Kingsfall
Briefing=Master, the prince who laughed at Mossgate now stands at Kingsfall's royal hunting lodges.\n\nCross the watched lava spans and defeat Aurel and his court. Capture or convert Falconer Edda, Huntsman Brann and Squire Wick, and keep at least twelve creatures at your heart.\n\nAurel must answer for every promise he made.
Debriefing=Aurel is beaten and all three champions are captive or converted. Castellan must answer alone at Hollowmark, where our first promise awaits.

[Level]
File=campaign/HollowmarkCitadel.level
Province=T24
Preview=previews/T24.png
Warden=High King Castellan
Difficulty=5
Title=Hollowmark Citadel
Briefing=My lord, Castellan's final proclamation awaits beyond Hollowmark's three walled courts.\n\nThe king who ordered Mossgate to crush you now hears your advance below his throne. Hold against the garrison, open the upper gates by the towers or their keys, and use the treasuries to sustain the assault.\n\nKill Castellan and claim the throne we promised at the beginning.
Debriefing=Castellan is dead and Hollowmark's throne is empty. Master, the kingdom is yours; every royal threat has ended here.

