# Campaign level sequence. Levels are played in this order; a level is
# unlocked when all levels before it are completed.
#
# [Level]       starts a new level entry
# File          level file, relative to the "levels" directory
# Title         name shown in the campaign menu
# Briefing      text shown before the level (\n starts a new line)
# Debriefing    text shown after the level was won
# Province      province or bonus site of the level on the world map
#               (gui/campaign/campaign-world.json). Optional; levels without
#               it are not shown on the map.
# Branch        province of the branch sister (both sisters name each other and
#               follow each other): completing one unlocks the levels after
#               them, the other stays playable. Optional.
# Warden        ruler of the province, shown in its tooltip. Optional.
# Difficulty    1 (easy) to 5, shown in the tooltip. Optional.

[Level]
File=campaign/Mossgate.level
Province=T01
Warden=Reeve Tobin Marsh
Difficulty=1
Title=Mossgate
Briefing=Master, the border village of Mossgate sleeps behind a single watch post, and its reeve trusts the moss to keep him hidden.\n\nThe rock around your heart is soft. Dig it out, mine the gold in the walls and claim the meadow cave beyond the gate.\n\nThen follow the cave roads to the village and strike down Reeve Tobin Marsh before he finds the courage to call for help.
Debriefing=The reeve lies silent and Mossgate is yours. The moss will grow over your banners now.

[Level]
File=campaign/Brackenford.level
Province=T02
Warden=Warden Elsa Brack
Difficulty=1
Title=Brackenford
Briefing=My lord, the folk of Brackenford live on both banks of a shallow ford and have more courage than soldiers.\n\nTheir warden has only a handful of heroes to send against you. Lay your first rooms in the fern caves on this bank, claim the grove and let your creatures gather.\n\nWhen the ford is yours, wade across and take her keep in the north-east.
Debriefing=Brack's keep is quiet and the ford runs under your banner. The fern caves belong to you.

[Level]
File=campaign/Coldwell.level
Province=T03
Warden=Warden Hugo Cole
Difficulty=1
Title=Coldwell
Briefing=Master, Coldwell drinks from one old well, and the springs whisper that a block of gold lies beneath it.\n\nTake the plaza, dig out the gold and spend it on an army. Warden Hugo Cole has shut his keep behind doors and cannons, but his watch is thin and his barracks are small.\n\nBreak the north gate and put an end to him.
Debriefing=Warden Cole is dead and the gates of his keep stand open. Coldwell is yours.

[Level]
File=campaign/Tinmoor.level
Province=T04
Warden=Warden Merrin Tay
Difficulty=2
Title=Tinmoor
Briefing=The miners of Tinmoor know every shaft and every seam, my lord, and they guard them fiercely.\n\nYou have little gold, so start with the tin seams and let the metal pay for your first doors and cannons. Warden Merrin Tay waits at the top of the mine behind two watch posts.\n\nSome of the old chambers were sealed long ago. Dig carefully and you may find one that answers to your heart.
Debriefing=Merrin Tay is dead and the seams of Tinmoor are yours to work.

[Level]
File=campaign/BoulderCourse.level
Province=B01
Bonus=1
Warden=Foreman Bram Tull
Difficulty=2
Title=The Boulder Course
Briefing=An old mine crew once rolled stone balls down these galleries to test their aim, and the course still stands. Four balls wait at the tees, so roll each of them into its cup before the shift bell.
Debriefing=All four boulders lie in their cups and the heart answers with a shard of the Heartstone.

[Level]
File=campaign/Ravensledge.level
Province=T05
Warden=Captain Osric Vane
Difficulty=2
Title=Ravensledge
Briefing=My lord, the fort of Ravensledge stands on three cliff shelves, and only a few bridges cross the chasms between them.\n\nCaptain Osric Vane has put archers on every ledge, so take each shelf slowly and cover your bridgeheads with doors and cannons.\n\nReach the keep on the highest shelf and put an end to him.
Debriefing=Captain Vane has fallen and the ravens have left the ledge. Ravensledge is yours.

[Level]
File=campaign/Ashcombe.level
Province=T06
Warden=Warden Liesl Ashby
Difficulty=2
Title=Ashcombe
Briefing=Master, the valley of Ashcombe still smokes from an old fire, and Warden Liesl Ashby is making ready to flee over the northern pass.\n\nYou have an army and gold to begin with, but not unlimited time. Cross the ash basin, take what the old mill offers and reach her hold before the wagons roll.\n\nIf she escapes, the valley will rise against you for good.
Debriefing=Liesl Ashby has fallen before her wagons could leave. The ashes of Ashcombe are yours.

[Level]
File=campaign/Greywater.level
Province=T07
Warden=Warden Corwin Gray
Difficulty=2
Title=Greywater
Briefing=Greywater lies on an underground river, master, and its warden trades iron with the dwarves of the deep.\n\nYou have no coin yet, so dig for it first. Across the water another keeper is under siege by the town's heroes; if he falls, they will turn on you.\n\nStrike down Warden Corwin Gray in his river hall, and whatever happens, keep your own heart alive.
Debriefing=Corwin Gray is dead and the river belongs to you. The dwarves will want new terms.

[Level]
File=campaign/HollinFen.level
Province=T08
Warden=Sister Agathe Hollin
Difficulty=3
Title=Hollin Fen
Briefing=My lord, Hollin Fen is a bog of holly thickets, and its convent holds more soldiers than sisters.\n\nSister Agathe Hollin keeps every door shut and sends patrols out without rest, so build up your dungeon before you wade in.\n\nBreak into the ward, reach the chapel and strike her down. Some walls in this fen were bricked up by the sisters, and one of them may answer to your heart.
Debriefing=Sister Agathe lies dead in her chapel, and Hollin Fen is yours.

[Level]
File=campaign/CrowshotGallery.level
Province=B02
Bonus=1
Warden=Gallery Keeper Wren
Difficulty=2
Title=The Crowshot Gallery
Briefing=A gallery above a lava lake was built for shooting at winged targets, and the hornets that nest on its islets have turned it into a real hunt. Possess one of your shooters and bring them down while the hourglass still holds.
Debriefing=Not a wing is left over the lava, and the heart gives you a shard of the Heartstone.

[Level]
File=campaign/Saltmere.level
Province=T09A
Branch=T09B
Warden=Admiral Bram Seward
Difficulty=3
Title=Saltmere
Briefing=My lord, Saltmere is a string of white salt flats and green lagoons, and its port is the only door the kingdom has to the sea.\n\nYou begin with a built dungeon but no coin, so dig the salt walls first. A sleeping keeper lives in the east cave with no army to speak of, and the heroes will come for his heart as well as yours.\n\nCross the flats, take the south shore and strike down Admiral Bram Seward in his harbour hall.
Debriefing=Admiral Seward has fallen and his fleet lies without a flag. Saltmere is yours.

[Level]
File=campaign/Dunmarrow.level
Province=T09B
Branch=T09A
Warden=Warden Ysolde Dunn
Difficulty=3
Title=Dunmarrow
Briefing=Master, Dunmarrow is a sea of dunes with old barrows beneath it, and Warden Ysolde Dunn is breaking camp in the far north-west.\n\nShe will not wait for you and the clock is against you. Use the old tunnels under the sand to cross faster than her scouts can watch, and reach her before her wagons leave.\n\nIf the wagons reach the road, the dunes will hide her for good.
Debriefing=Ysolde Dunn is dead in the sand and her wagons stand still. Dunmarrow is yours.

[Level]
File=campaign/Ironbridge.level
Province=T10
Warden=Warden Gareth Fenn
Difficulty=3
Title=Ironbridge
Briefing=My lord, Ironbridge forges the arms of the kingdom between three rifts of molten rock, and every crossing is a stone bridge under guard.\n\nYou have gold and a long clock, so build forges of your own before you cross. A rival keeper holds the hold in the north-east, and Warden Gareth Fenn arms his apprentices to throw you back.\n\nTake the bridges one by one and destroy the rival heart.
Debriefing=The rival heart is dark and the forges of Ironbridge are yours.

[Level]
File=campaign/Wolfscar.level
Province=T11
Warden=Huntmaster Rolf Scarrow
Difficulty=3
Title=Wolfscar
Briefing=Master, Wolfscar is a forest cut by two ravines, and four hunting keepers have made it their kennel, with Huntmaster Rolf Scarrow at their head.\n\nThey hate one another less than they hate you, and their packs will run together when they smell you. Cross the first ravine, take the wolf den for its gold and break the hunters one at a time.\n\nDestroy every rival keeper.
Debriefing=The last hunter is dead and the forest of Wolfscar is silent. Huntmaster Scarrow's packs are yours.

[Level]
File=campaign/Lanternhill.level
Province=T12
Warden=Lamplighter Ines Vale
Difficulty=3
Title=Lanternhill
Briefing=Master, Lanternhill is a hill that never goes dark, and Lamplighter Ines Vale keeps a rival keeper in its northern hall to feed the flames.\n\nYou begin with little coin and no army, so mine the seams before you build. The ring road around the hill is stopped with earth in places, and the soldiers of the kingdom will come through the east gate.\n\nDig your way round the hill and destroy the rival heart.
Debriefing=The rival heart is cold and the lamps of Lanternhill burn for you.

[Level]
File=campaign/TwistingHalls.level
Province=B03
Bonus=1
Warden=Lamp Warden Oswin
Difficulty=3
Title=The Twisting Halls
Briefing=The halls under Lanternhill twist like a knot, and the old keepers filled every corner with traps. Walk a creature of your own through the maze and reach the exit hall before the lamps burn out.
Debriefing=The exit hall is yours, and the heart gives you a shard of the Heartstone for the way you walked.

[Level]
File=campaign/Cinderhollow.level
Province=T13
Warden=Warden Pell Ashgrove
Difficulty=4
Title=Cinderhollow
Briefing=My lord, Cinderhollow is a crater of black ash, and Warden Pell Ashgrove will send the soldiers of the kingdom down into it in three waves while a rival keeper holds the north-eastern rim.\n\nYou begin with a modest purse and a small guard, so mine the western and southern seams before the first column arrives. The heroes come down by the north-west gate and the east gate, so set your doors and traps where those roads meet your lair.\n\nHold your heart until dawn. When the waves are spent, cross the lava bridge and destroy the rival keeper.
Debriefing=The rival keeper is dead and the ash of Cinderhollow settles around your heart.

[Level]
File=campaign/Thornreach.level
Province=T14
Warden=Warden Cassia Thorne
Difficulty=4
Title=Thornreach
Briefing=My lord, Thornreach is walled in thorn, and a maze of hedges joins five dungeons that Warden Cassia Thorne has set against each other.\n\nFour keepers hold the corners and they will trade blows with one another as readily as with you. You have a full purse, so build early and take the middle clearing before they do.\n\nCut through the maze and destroy every rival keeper.
Debriefing=The last keeper is dead and the thorns are quiet. Thornreach is yours.

[Level]
File=campaign/Bellwick.level
Province=T15
Warden=Abbot Lorens Bell
Difficulty=4
Title=Bellwick
Briefing=Master, the bells of Bellwick call the faithful to arms, and below the abbey an undead keeper wakes the sleepers in the crypts.\n\nYou come with a small guard and a modest purse. Hold the long nave, open the crypt cells, and expect the faithful from both gates of the transept.\n\nDestroy the undead keeper before Abbot Lorens Bell rings the last bell.
Debriefing=The undead keeper is dust and the bells hang silent. Bellwick is yours.

[Level]
File=campaign/Highcairn.level
Province=T16
Warden=Warden Hilde Cairn
Difficulty=4
Title=Highcairn
Briefing=My lord, Highcairn is a mountain of old graves, and Warden Hilde Cairn has made her hold at the top of it.\n\nYou have no army but your workers and a fair purse. Climb the terraces one at a time, bridge the lava seam, and keep your heart against the patrols that come down the mountain.\n\nReach the hold and strike down the warden.
Debriefing=Warden Cairn lies dead among her own stones. Highcairn is yours.

[Level]
File=campaign/SkittleCavern.level
Province=B04
Bonus=1
Warden=Cairnkeeper Hald
Difficulty=2
Title=The Skittle Cavern
Briefing=A vaulted cavern holds rows of stone-faced guards that stand in four lanes like skittles, and old boulder traps wait between them. Dig into each lane and let the boulders roll while the hourglass still holds.
Debriefing=The last guard has fallen and the lanes lie quiet. The heart gives you a shard of the Heartstone.

[Level]
File=campaign/Stormhaven.level
Province=T17
Warden=Captain Ivo Strand
Difficulty=4
Title=Stormhaven
Briefing=Master, the storm coast of Stormhaven belongs to four keepers at once, and Captain Ivo Strand lets them quarrel over his harbour while his ships wait.\n\nYou land with a full purse and a small guard. A black inlet divides the town and only two stone spans cross it, so hold the bridges and strike the keepers one at a time.\n\nExpect the neighbours to lend each other soldiers the moment you press one of them.
Debriefing=The last keeper is dead and the harbour lies calm. Stormhaven answers to you.

[Level]
File=campaign/Mirewatch.level
Province=T18A
Branch=T18B
Warden=Watcher Mora Fenwick
Difficulty=4
Title=Mirewatch
Briefing=My lord, the marsh of Mirewatch is crowned with eight towers, and Watcher Mora Fenwick keeps the last of them behind sealed ground.\n\nYou arrive with nothing but your workers, so dig before you build and build before you march. Causeways cross the black water between the towers and every tower will light a beacon when you come near.\n\nTake the towers, break the earth that stops the road and put the watcher down.
Debriefing=Mora Fenwick is dead and the beacon fires have gone out. Mirewatch is yours.

[Level]
File=campaign/Goldspire.level
Province=T18B
Branch=T18A
Warden=Treasurer Alaric Penn
Difficulty=4
Title=Goldspire
Briefing=Master, Goldspire rises from a bare plateau as a tower of rings, and Treasurer Alaric Penn counts the tax of the kingdom in its core.\n\nYour purse is thin and your army is only workers. The garrison pours out of the spire without rest, so build a strong dungeon before you touch the low town below it.\n\nWin the rings one by one, dig through the sealed links and strike down the treasurer.
Debriefing=Alaric Penn lies dead on his own coin. Goldspire is yours.

[Level]
File=campaign/Ebonrook.level
Province=T19
Warden=Warden Sabine Rook
Difficulty=5
Title=Ebonrook
Briefing=My lord, Ebonrook is a black wood that keeps its own night, and Warden Sabine Rook has hidden herself among its roots in the south.\n\nYou bring a large army and no gold at all. Heroes come out of the trees without pause, so mine in the glades, feed your creatures and cross the river by the northern bridges.\n\nDig through the earth around the roots and strike down the warden.
Debriefing=Sabine Rook is dead and the rooks fly south. Ebonrook is yours.

[Level]
File=campaign/VarnsCrossing.level
Province=T20
Warden=Marshal Varn
Difficulty=5
Title=Varn's Crossing
Briefing=Master, Marshal Varn holds the last great crossing of the kingdom, a fortress ringed with lava where two roads meet, and two rival keepers have come to take it from him.\n\nYou begin in the south-west with workers and a purse, and the heroes of the realm will march down all four roads without rest. Claim your quarter first and an old shrine of the garrison will open to you.\n\nThen take the lava-ringed fortress, because whoever holds it sees every column coming.
Debriefing=Both rival keepers are dead and the great roads lie quiet. Varn has lost his crossing.

[Level]
File=campaign/SwarmNight.level
Province=B05
Bonus=1
Heartstone=0
Warden=Night Reeve Sable
Difficulty=3
Title=The Swarm Night
Briefing=The rival keeper has sworn to bury your heart under his swarms, and the night is long. Hold your dungeon until the first light.
Debriefing=The first light has come and the swarm is gone. Your strongest fighter will follow you to the next land.

[Level]
File=campaign/Silverdeep.level
Province=T21
Warden=Warden Dorian Silt
Difficulty=5
Title=Silverdeep
Briefing=My lord, Silverdeep holds the richest mines of the kingdom, and Warden Dorian Silt has let three keepers dig his seams until they began to dig each other.\n\nYou come down the north-east shaft with an empty purse and a handful of creatures, so mine first and build second. Three deep lakes lie between you and the rivals, and wooden spans are the only way across.\n\nTwo of the keepers have sworn to share what they win from you, so strike them before they join.
Debriefing=The last rival lies dead beside his silver. Silverdeep answers to you.

[Level]
File=campaign/Wraithwood.level
Province=T22
Warden=Witch-Warden Elowen Ash
Difficulty=5
Title=Wraithwood
Briefing=Master, Wraithwood is a forest of grey trunks and drifting fog, and Witch-Warden Elowen Ash has bound a rival keeper to her cause.\n\nBoth hearts must fall, hers in the north-west and his on the north-eastern rim, and each will send soldiers to the other whenever you press one of them. Meanwhile the heroes of the kingdom march out of their portal in the south-east, wave after wave, so raise your defences before you go hunting.\n\nDestroy both hearts and the fog will lift.
Debriefing=The witch-warden and the rival keeper are dead and the fog lifts from Wraithwood. The grey trunks stand quiet.

[Level]
File=campaign/Kingsfall.level
Province=T23
Warden=Prince Aurel
Difficulty=5
Title=Kingsfall
Briefing=Master, Prince Aurel has made his stand in the royal hunting grounds, and a winding ravine of lava now parts his court from the rest of the realm.\n\nThree of his champions, Falconer Edda, Huntsman Brann and Squire Wick, hold the lodges and the glade, and a keeper who wants the crown must take them alive. Fill your prison and your torture chamber, then raise an army of your own from their ranks.\n\nHunting parties and heralds will ride out against you the whole way, so bring gold and patience.
Debriefing=The prince is beaten and his champions are in your hands. The hunting grounds of Kingsfall are yours.

[Level]
File=campaign/HollowmarkCitadel.level
Province=T24
Warden=High King Castellan
Difficulty=5
Title=Hollowmark Citadel
Briefing=My lord, this is the capital. High King Castellan sits on his throne at the top of three walled courts, and every hero in the kingdom is marching to defend him.\n\nYou begin in the south with workers and a modest purse. The first gate stands open, but the two upper gates are sealed with earth over trenches of lava, and the king's garrison will pour from the towers on both flanks.\n\nBreak through court by court, plunder the garrison treasuries to pay for the fight, and strike down the king.
Debriefing=High King Castellan is dead and the throne of Hollowmark stands empty. The kingdom is yours.

