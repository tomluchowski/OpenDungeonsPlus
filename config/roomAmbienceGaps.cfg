# Room ambience of three moments: a creature wakes up in the dormitory, an enemy enters the guard
# room, a creature is healed in the temple. Format and keys: see config/roomAmbience.cfg. The
# events are found by watching the creatures (RoomAmbience.cpp); nothing is sent over the network.
# Each room already has its idle and working effects (roomAmbienceCare.cfg, roomAmbienceOther.cfg).

[RoomAmbience]
    [Effects]
        ##### Dormitory: a creature gets up #####

        [Effect]
            Name        DormitoryWakeBlanket
            Target      Event
            Event       CreatureWoke
            Match       dormitoryRoom
            Kind        Particle
            System      RoomAmbWakeBlanket
            Duration    1.8
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        DormitoryWakeLight
            Target      Event
            Event       CreatureWoke
            Match       dormitoryRoom
            Kind        Particle
            System      RoomAmbWakeLight
            Duration    2.2
            MaxDistance 22
            Priority    3
        [/Effect]

        ##### Guard room: an enemy is inside #####

        [Effect]
            Name        GuardRoomAlarmHorn
            Target      Event
            Event       EnemyEntered
            Match       guardRoom
            Kind        Particle
            System      RoomAmbAlarmHorn
            Duration    3.0
            MaxDistance 30
            Priority    6
            Reduced     yes
        [/Effect]

        [Effect]
            Name        GuardRoomAlarmWave
            Target      Event
            Event       EnemyEntered
            Match       guardRoom
            Kind        Particle
            System      RoomAmbAlarmWave
            Duration    2.6
            MaxDistance 30
            Priority    5
        [/Effect]

        [Effect]
            Name        GuardRoomAlarmStomp
            Target      Event
            Event       EnemyEntered
            Match       guardRoom
            Kind        Particle
            System      RoomAmbAlarmStomp
            Duration    1.6
            MaxDistance 22
            Priority    4
        [/Effect]

        ##### Temple: the bell and the healing light #####

        [Effect]
            Name        TempleBellRing
            Target      Event
            Event       CreatureHealed
            Match       templeRoom
            Kind        Particle
            System      RoomAmbBellRing
            Duration    3.0
            MaxDistance 26
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleHealLight
            Target      Event
            Event       CreatureHealed
            Match       templeRoom
            Kind        Particle
            System      RoomAmbHealLight
            Duration    2.4
            MaxDistance 22
            Priority    4
        [/Effect]

        [Effect]
            Name        TempleHealSpecks
            Target      Event
            Event       CreatureHealed
            Match       templeRoom
            Kind        Particle
            System      RoomAmbHealSpecks
            Duration    2.0
            MaxDistance 20
            Priority    3
        [/Effect]
    [/Effects]
[/RoomAmbience]
