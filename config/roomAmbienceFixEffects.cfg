# Room ambience of the last gaps: the heart when it is hit, the wave portal, raising in the crypt, a new prisoner, a
# converted prisoner, the cannon and spike shot, the lightning bolt of the lightning trap, the waving flag of the
# watch banner, a damaged rune door, a dented steel door, a secret door that opens and the spark at the keeper's
# hand. Format and keys: see config/roomAmbience.cfg. Nothing new is sent over the network (the events below are
# found by the client, the watch banner uses the trap effect messages that exist):
#   HeartHit         the heart badge of the local keeper (the health the server already reports) went down
#   CryptRaised      a creature appears on a tile of a crypt
#   PrisonerArrived  a creature is put in jail on a tile of a prison
#   TortureConverted a creature changes its seat on a tile of a torture chamber
#   SpellFxHandCast  the server accepted a spell of the local keeper (message "SpellFx/HandCast", sent to the
#                    caster only), shown at the place of the hand
# The watch banner fires when it calls the guards: the server sends fired (TrapFired, the flag flares), then reloading
# for GuardRoomDistressSeconds (the flag hangs, clip Droop) and ready (the flag flies again, clip Loop).

[RoomAmbience]
    [Effects]
        ##### Dungeon heart: hit #####

        [Effect]
            Name        HeartHitBurst
            Target      Event
            Event       HeartHit
            Match       dungeonTempleRoom
            Kind        Particle
            System      RoomAmbHeartHitBurst
            Offset      0 0 1.4
            Duration    1.4
            MaxDistance 40
            Priority    9
        [/Effect]

        [Effect]
            Name        HeartHitFlash
            Target      Event
            Event       HeartHit
            Match       dungeonTempleRoom
            Kind        Particle
            System      RoomAmbFlash
            Offset      0 0 1.4
            Duration    1.0
            MaxDistance 40
            Priority    9
            Reduced     yes
        [/Effect]

        # The heart beats faster and harder for a second
        [Effect]
            Name        HeartHitPulse
            Target      Object
            Match       DungeonTempleObject
            When        Hit
            Kind        Motion
            Motion      Pulse
            Amount      0.06
            Speed       4.5
            MaxDistance 40
            Priority    10
            Reduced     yes
        [/Effect]

        [Effect]
            Name        HeartHitSound
            Target      Event
            Event       HeartHit
            Match       dungeonTempleRoom
            Kind        Sound
            Family      Rooms/Heart/Hit
            MaxDistance 40
            Reduced     yes
        [/Effect]

