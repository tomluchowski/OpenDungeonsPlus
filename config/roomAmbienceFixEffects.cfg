# Room ambience of the last gaps: the waving flag of the watch banner and the spark at the keeper's hand where
# a spell is cast. Format and keys: see config/roomAmbience.cfg. Nothing new is sent over the network (the events
# below are found by the client, the watch banner uses the trap effect messages that exist):
#   SpellFxHandCast  the server accepted a spell of the local keeper (message "SpellFx/HandCast", sent to the
#                    caster only), shown at the place of the hand
# The watch banner fires when it calls the guards: the server sends fired (TrapFired, the flag flares), then reloading
# for GuardRoomDistressSeconds (the flag hangs, clip Droop) and ready (the flag flies again, clip Loop).

[RoomAmbience]
    [Effects]

        ##### Watch banner: the flag waves (its Loop clip), hangs while the post reloads, and flares when it calls the guards #####

        [Effect]
            Name        WatchBannerWave
            Target      Object
            Match       trap:WatchBanner
            When        Ready
            Kind        Clip
            Clips       Loop
            Every       3.4
            MaxDistance 22
            Priority    3
            Reduced     yes
        [/Effect]

        # While the post reloads after its call the flag hangs: the cloth is plumb, nothing waves
        [Effect]
            Name        WatchBannerDroop
            Target      Object
            Match       trap:WatchBanner
            When        Reloading
            Kind        Clip
            Clips       Droop
            Every       1
            MaxDistance 22
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WatchBannerFlare
            Target      Event
            Match       WatchBanner
            Event       TrapFired
            Kind        Particle
            System      SpFxRallyFlash
            Offset      0 0 1.0
            Duration    1.6
            MaxDistance 30
            Priority    6
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WatchBannerSparks
            Target      Event
            Match       WatchBanner
            Event       TrapFired
            Kind        Particle
            System      SpFxRallySparks
            Offset      0 0 1.0
            Duration    1.6
            MaxDistance 24
            Priority    5
        [/Effect]

        [Effect]
            Name        WatchBannerAlertSound
            Target      Event
            Match       WatchBanner
            Event       TrapFired
            Kind        Sound
            Family      Traps/WatchBanner/Fire
            MaxDistance 24
            Reduced     yes
        [/Effect]

        ##### Keeper's hand: a small spark where a spell is cast #####

        [Effect]
            Name        SpellHandCastSpark
            Target      Event
            Event       SpellFxHandCast
            Kind        Particle
            System      RoomAmbHandCastSpark
            Duration    0.8
            MaxDistance 40
            Priority    6
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
