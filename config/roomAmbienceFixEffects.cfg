# Room ambience of the last gaps: here only the spark at the keeper's hand where a spell is cast. Format and keys:
# see config/roomAmbience.cfg. Nothing is sent over the network for it except the spell message of the server:
#   SpellFxHandCast  the server accepted a spell of the local keeper (message "SpellFx/HandCast", sent to the
#                    caster only), shown at the place of the hand

[RoomAmbience]
    [Effects]

        ##### Keeper's hand: a small spark where a spell is cast #####

        [Effect]
            Name        SpellHandCastSpark
            Target      Event
            Event       SpellFxHandCast
            Kind        Particle
            System      RoomAmbHandCastSpark
            Duration    0.8
            MaxDistance 40
            Priority    6
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
