# Relationships between creatures of the same keeper.
# Values run from -100 to 100. Missing entries use the defaults of the game.
[Relationships]
# Tier thresholds
    ThresholdFriends	50
    ThresholdBestFriends	80
    ThresholdLovers	90
    ThresholdHated	-50
    ThresholdNemesis	-80
# A pair that had no event for DriftIdleTurns turns moves DriftAmount points towards 0
# every DriftIntervalTurns turns.
    DriftAmount	1
    DriftIntervalTurns	30
    DriftIdleTurns	420
# Change of the value per event
    EventTrainingTogether	3
    EventDefeatedEnemiesTogether	8
    EventArenaLoss	-10
    EventChickenSnatched	-12
# Training together counts once per pair in this many turns (one training cycle)
    TrainingTogetherCooldownTurns	40
# Creatures that hit the same enemy within this many turns took part in defeating it
    FightParticipantTurns	100
# Racial start values, applied when a pair of creatures first gets a value:
# Racial_<ClassA>_<ClassB> <value> (class names from creatures.cfg, order does not matter)
    Racial_Orc_Orc	10
    Racial_Orc_Troll	10
    Racial_Goblin_Orc	8
    Racial_Lich_Skeleton	10
    Racial_Elf_Orc	-15
    Racial_DarkElf_Elf	-20
    Racial_LizardMan_Spider	-10
[/Relationships]
