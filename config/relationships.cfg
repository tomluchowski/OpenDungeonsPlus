# Relationships between creatures of the same keeper.
# Values run from -100 to 100. Missing entries use the defaults of the game.
[Relationships]
# Tier thresholds
    ThresholdFriends	50
    ThresholdBestFriends	80
    ThresholdLovers	90
    ThresholdHated	-50
    ThresholdNemesis	-80
# A pair that had no event for DriftIdleTurns turns moves DriftAmount points towards 0
# every DriftIntervalTurns turns.
    DriftAmount	1
    DriftIntervalTurns	30
    DriftIdleTurns	420
# Change of the value per event
    EventTrainingTogether	3
    EventDefeatedEnemiesTogether	8
    EventArenaLoss	-10
    EventChickenSnatched	-12
# Training together counts once per pair in this many turns (one training cycle)
    TrainingTogetherCooldownTurns	40
# Creatures that hit the same enemy within this many turns took part in defeating it
    FightParticipantTurns	100
# Side by side: both creatures fight within CombatRadiusTiles tiles of each other.
# Friends / best friends add defense to every defense value, a nemesis nearby takes
# CombatPenaltyNemesis away again.
    CombatRadiusTiles	3
    CombatBonusFriends	0.75
    CombatBonusBestFriends	1.5
    CombatPenaltyNemesis	0.75
# Mood points lost per hated creature (hated / nemesis), at most MoodMaxPairs count
    MoodPenaltyHated	250
    MoodPenaltyNemesis	400
    MoodMaxPairs	2
# Limits per creature: the weakest relationship of a tier falls back when exceeded.
# MaxPartners belongs to the lovers tier, which is not active yet.
    MaxFriends	3
    MaxPartners	1
    MaxNemeses	2
# Nemesis brawls (never lethal): a nemesis pair that is close and idle is checked every
# BrawlCheckIntervalTurns turns and brawls with BrawlChancePercent percent. A brawl ends at
# BrawlStopHealthPercent percent health of either creature, when the keeper slaps one of them or
# after BrawlMaxTurns turns; the value then changes by BrawlValueChange.
    BrawlCheckIntervalTurns	20
    BrawlChancePercent	6
    BrawlMaxDistanceTiles	6
    BrawlStopHealthPercent	25
    BrawlMaxTurns	150
    BrawlValueChange	-6
# Mentoring: a friend training in the same room that is at least MentorMinLevelDiff levels higher
# raises the experience of the creature by MentorXpBonusPercent percent
    MentorMinLevelDiff	2
    MentorXpBonusPercent	50
# Mood points from events (grief, ...) are capped at TempMoodMax and fade by TempMoodDecayPerTurn
# points each turn. Grief: when a friend dies the creature loses GriefMoodPenalty mood points and
# deals GriefRageBonusPercent percent more damage to the side of the killer for GriefRageTurns turns
    TempMoodMax	1000
    TempMoodDecayPerTurn	3
    GriefMoodPenalty	400
    GriefRageTurns	300
    GriefRageBonusPercent	30
# Jealousy: when a creature becomes friends with another one, its friends lose JealousyValueLoss
# points towards the newcomer (0 = off)
    JealousyValueLoss	3
# Racial start values, applied when a pair of creatures first gets a value:
# Racial_<ClassA>_<ClassB> <value> (class names from creatures.cfg, order does not matter)
    Racial_Orc_Orc	10
    Racial_Orc_Troll	10
    Racial_Goblin_Orc	8
    Racial_Lich_Skeleton	10
    Racial_Elf_Orc	-15
    Racial_DarkElf_Elf	-20
    Racial_LizardMan_Spider	-10
[/Relationships]
