# Relationships between creatures of the same keeper.
# Values run from -100 to 100. Missing entries use the defaults of the game.
[Relationships]
# Tier thresholds
    ThresholdFriends	50
    ThresholdBestFriends	80
    ThresholdLovers	90
    ThresholdHated	-50
    ThresholdNemesis	-80
# A pair that had no event for DriftIdleTurns turns moves DriftAmount points towards 0
# every DriftIntervalTurns turns.
    DriftAmount	1
    DriftIntervalTurns	10
    DriftIdleTurns	30
# Change of the value per event
    EventTrainingTogether	2
    EventDefeatedEnemiesTogether	8
    EventArenaLoss	-10
    EventChickenSnatched	-12
[/Relationships]
