# Room ambience of three moments: the dungeon heart of the local keeper is badly hurt, a game in the
# casino is won or lost, the crowd of the arena cheers. Format and keys: see config/roomAmbience.cfg.
# The health limits are fractions of the heart health (Below). Nothing is sent over the network: the
# heart health is the one the badge in the top left corner already shows, the casino events are found
# by watching the creatures (RoomAmbience.cpp), the cheering is started by the creature reactions.

[RoomAmbience]
    [Effects]
        ##### Dungeon heart: low health. The lower the health, the stronger the flare #####

        # Below a third: a red flare swells and fades, the heart beats faster
        [Effect]
            Name        HeartLowFlare
            Target      Object
            Match       DungeonTempleObject
            When        LowHealth
            Below       0.35
            Kind        Particle
            System      RoomAmbHeartLowFlare
            Offset      0 0 1.4
            MaxDistance 36
            Priority    9
            Reduced     yes
        [/Effect]

        [Effect]
            Name        HeartLowPulse
            Target      Object
            Match       DungeonTempleObject
            When        LowHealth
            Below       0.35
            Kind        Motion
            Motion      Pulse
            Amount      0.03
            Speed       1.9
            MaxDistance 36
            Priority    9
            Reduced     yes
        [/Effect]

        # Below a fifth: sparks are thrown out in bursts
        [Effect]
            Name        HeartLowBurst
            Target      Object
            Match       DungeonTempleObject
            When        LowHealth
            Below       0.2
            Kind        Particle
            System      RoomAmbHeartLowBurst
            Offset      0 0 1.4
            MaxDistance 30
            Priority    9
        [/Effect]

        # Below a tenth: a large white-hot flare and a hard, fast pulse
        [Effect]
            Name        HeartLowCritical
            Target      Object
            Match       DungeonTempleObject
            When        LowHealth
            Below       0.1
            Kind        Particle
            System      RoomAmbHeartLowCritical
            Offset      0 0 1.4
            MaxDistance 36
            Priority    10
            Reduced     yes
        [/Effect]

        [Effect]
            Name        HeartLowPulseHard
            Target      Object
            Match       DungeonTempleObject
            When        LowHealth
            Below       0.1
            Kind        Motion
            Motion      Pulse
            Amount      0.05
            Speed       3.0
            MaxDistance 36
            Priority    10
        [/Effect]

        ##### Casino: a game is won or lost #####

        [Effect]
            Name        CasinoWinCoins
            Target      Event
            Event       CasinoWin
            Match       casinoRoom
            Kind        Particle
            System      RoomAmbCasinoWinCoins
            Offset      0 0 0.9
            Duration    2.0
            MaxDistance 26
            Priority    6
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CasinoWinFlash
            Target      Event
            Event       CasinoWin
            Match       casinoRoom
            Kind        Particle
            System      RoomAmbFlash
            Offset      0 0 1.3
            Duration    1.0
            MaxDistance 26
            Priority    5
        [/Effect]

        [Effect]
            Name        CasinoWinRain
            Target      Event
            Event       CasinoWin
            Match       casinoRoom
            Kind        Particle
            System      RoomAmbCasinoWinRain
            Duration    2.0
            MaxDistance 22
            Priority    4
        [/Effect]

        [Effect]
            Name        CasinoWinSound
            Target      Event
            Event       CasinoWin
            Match       casinoRoom
            Kind        Sound
            Family      Rooms/Casino/Win
            MaxDistance 26
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CasinoLossSmoke
            Target      Event
            Event       CasinoLoss
            Match       casinoRoom
            Kind        Particle
            System      RoomAmbCasinoLossSmoke
            Duration    2.2
            MaxDistance 24
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CasinoLossSparks
            Target      Event
            Event       CasinoLoss
            Match       casinoRoom
            Kind        Particle
            System      RoomAmbCasinoLossSparks
            Duration    1.4
            MaxDistance 20
            Priority    4
        [/Effect]

        [Effect]
            Name        CasinoLossGroan
            Target      Event
            Event       CasinoLoss
            Match       casinoRoom
            Kind        Sound
            Family      Rooms/Casino/Loss
            Delay       0.25
            MaxDistance 24
            Reduced     yes
        [/Effect]

        ##### Arena: the crowd cheers while others fight #####

        [Effect]
            Name        ArenaCheerConfetti
            Target      Event
            Event       ArenaCheer
            Match       arenaRoom
            Kind        Particle
            System      RoomAmbArenaCheerConfetti
            Offset      0 0 0.8
            Duration    2.2
            MaxDistance 30
            Priority    6
        [/Effect]

        [Effect]
            Name        ArenaCheerSound
            Target      Event
            Event       ArenaCheer
            Match       arenaRoom
            Kind        Sound
            Family      Rooms/Arena/Cheer
            MaxDistance 30
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
