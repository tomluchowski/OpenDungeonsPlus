# Trap configuration file.
# Traps configurable elements are defined within [Traps] [/Traps]
# There is no need to use child tags for each trap (to make reading easier). However, to make things more
# understandable, elements name should begin by the trap name and be gathered per trap type.
#
# Supported elements:
# AlarmCostPerTile                  (int)    Cost per tile for alarm trap
# AlarmWorkshopPointsPerTile        (int)    How many Workshop points required to craft an Alarm
# AlarmReloadTurns                  (uint)   How many turns to wait before an alarm trap can warn again
# AlarmNbShootsBeforeDeactivation   (uint)   How many times an alarm trap warns before it must be crafted again
# AlarmRadius                       (uint)   Radius in tiles in which the alarm trap notices enemy creatures and warns its owner
# BoulderCostPerTile                (int)    Cost per tile for boulder trap
# BoulderWorkshopPointsPerTile      (int)    How many Workshop points required to craft a Boulder
# BoulderReloadTurns                (uint)   How many turns to wait for a boulder to reload
# BoulderSpeed                      (double) Boulder speed (tiles per turn)
# BoulderDamagePerHitMin            (double) How many damages a boulder deals when it hits minimum
# BoulderDamagePerHitMax            (double) How many damages a boulder deals when it hits maximum
# CannonCostPerTile                 (int)    Cost per tile for cannon trap
# CannonPhyDef                      (double) Physical defense when the trap is attacked
# CannonMagDef                      (double) Magical defense when the trap is attacked
# CannonEleDef                      (double) Elemental defense when the trap is attacked
# CannonWorkshopPointsPerTile       (int)    How many Workshop points required to craft a Cannon
# CannonRange                       (uint)   Range of cannon trap
# CannonSpeed                       (double) Cannon speed (tiles per turn)
# CannonReloadTurns                 (uint)   How many turns to wait for a Cannon to reload
# CannonDamagePerHitMin             (double) How many damages a Cannon deals when it hits minimum
# CannonDamagePerHitMax             (double) How many damages a Cannon deals when it hits maximum
# SpikeCostPerTile                  (int)    Cost per tile for spike trap
# SpikeWorkshopPointsPerTile        (int)    How many Workshop points required to craft a Spike
# SpikeReloadTurns                  (uint)   How many turns to wait for a spiketrap to reload
# SpikeDamagePerHitMin              (double) How many damages a spiketrap deals when it hits minimum
# SpikeDamagePerHitMax              (double) How many damages a spiketrap deals when it hits maximum
# GasCostPerTile                    (int)    Cost per tile for gas trap
# GasWorkshopPointsPerTile          (int)    How many Workshop points required to craft a Gas trap
# GasReloadTurns                    (uint)   How many turns to wait before a gas trap can fire again
# GasNbShootsBeforeDeactivation     (uint)   How many times a gas trap fires before it must be crafted again
# GasRadius                         (uint)   Radius in tiles of the poison cloud
# GasDamagePerHitMin                (double) Minimum damage the cloud deals to each creature in it
# GasDamagePerHitMax                (double) Maximum damage the cloud deals to each creature in it
# LightningCostPerTile              (int)    Cost per tile for lightning trap
# LightningWorkshopPointsPerTile    (int)    How many Workshop points required to craft a Lightning trap
# LightningReloadTurns              (uint)   How many turns to wait before a lightning trap can fire again
# LightningNbShootsBeforeDeactivation (uint) How many times a lightning trap fires before it must be crafted again
# LightningRange                    (uint)   Range in tiles in which the trap picks its target
# LightningDamagePerHitMin          (double) Minimum damage of a bolt (doubled for a target standing in water)
# LightningDamagePerHitMax          (double) Maximum damage of a bolt (doubled for a target standing in water)
# LightningStunTurns                (uint)   How many turns the struck creature stays stunned
# FireburstCostPerTile              (int)    Cost per tile for fireburst trap
# FireburstWorkshopPointsPerTile    (int)    How many Workshop points required to craft a Fireburst trap
# FireburstReloadTurns              (uint)   How many turns to wait before a fireburst trap can fire again
# FireburstNbShootsBeforeDeactivation (uint) How many times a fireburst trap fires before it must be crafted again
# FireburstRadius                   (uint)   Radius in tiles of the fire burst (also the distance at which an enemy triggers it)
# FireburstDamagePerHitMin          (double) Minimum damage the burst deals to each creature in it
# FireburstDamagePerHitMax          (double) Maximum damage the burst deals to each creature in it
# FreezeCostPerTile                 (int)    Cost per tile for freeze trap
# FreezeWorkshopPointsPerTile       (int)    How many Workshop points required to craft a Freeze trap
# FreezeReloadTurns                 (uint)   How many turns to wait before a freeze trap can fire again
# FreezeNbShootsBeforeDeactivation  (uint)   How many times a freeze trap fires before it must be crafted again
# FreezeDurationTurns               (uint)   How many turns the enemies on the tile stay frozen
# FreezeShatterHpPercent            (double) A creature at or below this percentage of its maximum health shatters instead of freezing
# WatchBannerCostPerTile              (int)    Cost per tile for watch banner
# WatchBannerWorkshopPointsPerTile    (int)    How many Workshop points required to craft a Watch banner
# WatchBannerAuraTiles                (int)    Radius in tiles in which a watch banner notices enemies and calls the guards
# TriggerCostPerTile                (int)    Cost per tile for trigger trap
# TriggerWorkshopPointsPerTile      (int)    How many Workshop points required to craft a Trigger trap
# TriggerReloadTurns                (uint)   How many turns to wait before a trigger trap can fire again
# TriggerNbShootsBeforeDeactivation (uint)   How many times a trigger trap fires before it must be crafted again
# CannonManaToFire                  (double) Mana taken from the owner every time a cannon fires; it does not fire without
# LightningManaToFire               (double) Mana taken from the owner every time a lightning trap fires; it does not fire without
# FireburstManaToFire               (double) Mana taken from the owner every time a fireburst trap fires; it does not fire without
# RunedDoorManaToFire               (double) Mana taken from the owner every time a runed door fires; it does not fire without
#                                            (traps and doors without such an entry cost no mana)
# <Trap>ManaUpkeepPerSecond           (double) Mana per second the owner pays for every armed tile of that trap, together with the worker upkeep
# WoodenDoorCostPerTile             (int)    Cost per tile for wooden doors
# WoodenDoorPointsPerTile           (int)    How many Workshop points required to craft a wooden door
# WoodenDoorHP                      (double) Health of a wooden door
# IronboundDoorCostPerTile             (int)    Cost per tile for ironbound doors
# IronboundDoorPointsPerTile           (int)    How many Workshop points required to craft a ironbound door
# IronboundDoorHP                      (double) Health of a ironbound door
# SteelDoorCostPerTile              (int)    Cost per tile for steel doors
# SteelDoorPointsPerTile            (int)    How many Workshop points required to craft a steel door
# SteelDoorHP                       (double) Health of a steel door
# BarricadeDoorCostPerTile          (int)    Cost per tile for barricades
# BarricadeDoorPointsPerTile        (int)    How many Workshop points required to craft a barricade
# BarricadeDoorHP                   (double) Health of a barricade
# SecretDoorCostPerTile             (int)    Cost per tile for secret doors
# SecretDoorPointsPerTile           (int)    How many Workshop points required to craft a secret door
# SecretDoorHP                      (double) Health of a secret door
# RunedDoorCostPerTile              (int)    Cost per tile for runed doors
# RunedDoorPointsPerTile            (int)    How many Workshop points required to craft a runed door
# RunedDoorHP                       (double) Health of a runed door
# RunedDoorRegenPerTurn             (double) Health a runed door regenerates every turn
# RunedDoorReloadTurns              (uint)   How many turns a runed door needs to recharge after firing
# RunedDoorDamage                   (double) Fire damage dealt to every enemy standing on the runed door when it fires
# TrapReloadByWorkers               (uint)   1 = a free worker re-arms a trap tile that used up its shots on the spot (for gold, no crafting); 0 = such a tile needs a new crafted trap as before
# TrapReloadWorkTurns               (uint)   Turns of work a worker needs to re-arm one tile
# TrapReloadCostDefault             (double) Gold per tile the seat pays for a reload when a trap type has no <Trap>ReloadCost entry
# <Trap>ReloadCost                  (double) Gold per tile the seat pays for reloading that trap type (Alarm, Boulder, Cannon, Spike, Fear, Gas,
#                                            Lightning, Fireburst, Freeze, WatchBanner, Trigger), e.g. SpikeReloadCost
# TrapReloadWorkerSharePercent      (double) Workers reloading traps are at most this share (percent) of the workers doing digging, claiming,
#                                            carrying or reloading
# TrapReloadSearchRadius            (double) Tiles around the worker within which it looks for a trap to re-arm
# TrapReloadRetryTurns              (uint)   Turns before workers try the same tile again after the seat could not pay
# TrapReloadExperience              (double) Experience the worker gets for each reload

