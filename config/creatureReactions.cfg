# Creature reactions definition file.
# Reactions are short cosmetic one-shot effects on a creature (an icon above its head, particles,
# a pose, a small hop). They are shown by each client on its own and have no influence on the
# game rules, the creature AI, the saved games or the network traffic.
#
# The file has three blocks inside [CreatureReactions] [/CreatureReactions]:
#
# [Settings]
#   MaxSimultaneous      Maximum number of reactions shown at the same time.
#   MaxCameraDistance    Creatures farther from the camera than this (world units) show nothing.
#   GroupStaggerMin/Max  Delay range in seconds between the creatures of a group that react one after the other.
#   DefaultGroup         Group used for a creature that is in no group.
#
# [Groups]  Each [Group] has a Name and the Creatures (creature definition names) in it. A variant can
#           be limited to some groups, so that a kind of creature gets the variants that suit it.
#
# [Events]  Each [Event] is a kind of reaction with its variants. A variant is chosen at random, by weight, among
#           the variants allowed for the creature.
#   Name         Name of the event, used by the game and by the console command 'reaction'.
#   Priority     death, combat, held, event, work, mood or ambient (most to least important). A reaction
#                only starts when the creature does something less important, and a more important reaction
#                replaces a running one.
#   Cooldown     Seconds before the same creature shows this event again.
#   Probability  Chance (0 to 1) that a trigger leads to a reaction.
#   GroupMax     Maximum number of creatures that react when a whole group is triggered.
#
#   Keys of a [Variant]:
#   Name               Name of the variant.
#   Weight             Chance of the variant compared to the others.
#   Clip               Tier C: animation made for the reaction: Clip <name> [speed]
#   Fallback           Tier B: animation every creature of the mesh has: Fallback <name> [speed [start end]]
#                      start and end are fractions of the animation length. Used if Clip is missing.
#   Emote              Tier A: icon above the head: Emote <name> [seconds]. The icon is the material CreatureEmote_<name>.
#   Effect             Tier A: particle system put on the creature: Effect <name> [seconds]
#   Motion             Small movement of the model: Motion hop <count> <height> <seconds>
#   Cooldown, Probability   Replace the values of the event for this variant.
#   Creatures, Groups, Jobs  Limit the variant to creature definitions, groups or jobs (Fighter, Worker).
#   RequiresSleepNeed  yes: only for creature types that get tired (WakefulnessLost/Turn above 0 in creatures.cfg).
#                      Used for yawning and nodding off.
#
# What is missing is skipped: no animation means the next tier, no icon or effect means that part is left out.
# Animations and poses are only shown while the creature stands still and everything but the icon
# only in the option 'Creature reactions: full'. In 'reduced' only the icon is shown, 'off' shows nothing.

[CreatureReactions]

[Settings]
    MaxSimultaneous     6
    MaxCameraDistance   45
    GroupStaggerMin     0.12
    GroupStaggerMax     0.45
    DefaultGroup        Fighters
[/Settings]

[Groups]
    [Group]
        Name        LargeBeasts
        Creatures   Troll Wyvern Dragon PitDemon Scarab NatureMonster TentacleAlbine TentacleGreen
    [/Group]
    [Group]
        Name        SmallWorkers
        Creatures   Kobold DwarfWorker
    [/Group]
    [Group]
        Name        Fighters
        Creatures   Orc LavaSpawn LizardMan Goblin Skeleton Adventurer Dwarf1 Dwarf2 Knight RunelordDwarf Defender Kreatur
    [/Group]
    [Group]
        Name        Spellcasters
        Creatures   Cultist Lich Monk Wizard DarkElf Elf
    [/Group]
    [Group]
        Name        SmallCritters
        Creatures   Rat Roach Spider CaveHornet Slime Gnome
    [/Group]
[/Groups]

# The events below only exist to try the reaction framework with the console command
# 'reaction <event> [creature|all|group]'. The events of the game are added in the following steps.
[Events]
    [Event]
        Name        TestEmote
        Priority    event
        Cooldown    1
        [Variant]
            Name    Exclamation
            Emote   Exclamation 2
        [/Variant]
        [Variant]
            Name    Question
            Emote   Question 2
        [/Variant]
        [Variant]
            Name    Bulb
            Emote   Bulb 2
        [/Variant]
        [Variant]
            Name    Heart
            Emote   Heart 2
        [/Variant]
        [Variant]
            Name    Coin
            Emote   Coin 2
        [/Variant]
        [Variant]
            Name    Note
            Emote   Note 2
        [/Variant]
    [/Event]

    [Event]
        Name        TestHop
        Priority    event
        Cooldown    1
        [Variant]
            Name    HopWithSparks
            Emote   Exclamation 1.5
            Effect  ReactionSparks 1.2
            Motion  hop 2 0.25 1.0
        [/Variant]
    [/Event]

    [Event]
        Name        TestClip
        Priority    event
        Cooldown    1
        # The clip 'TestNoSuchClip' exists for no creature: this shows the fall back to the clip of the mesh.
        [Variant]
            Name    DanceInstead
            Weight  2
            Clip    TestNoSuchClip
            Fallback Dance 1.0
            Emote   Note 2.5
        [/Variant]
        [Variant]
            Name    WeaponRaise
            Fallback Attack1 0.7 0.0 0.5
            Emote   Exclamation 1.5
        [/Variant]
    [/Event]

    [Event]
        Name        TestEffects
        Priority    event
        Cooldown    1
        [Variant]
            Name    Coins
            Emote   Coin 1.5
            Effect  ReactionCoins 1.5
        [/Variant]
        [Variant]
            Name    Dust
            Effect  ReactionDust 1.2
            Motion  hop 1 0.15 0.4
        [/Variant]
        [Variant]
            Name    Steam
            Emote   Steam 2
            Effect  ReactionSteam 2
        [/Variant]
    [/Event]

    # Only for creatures that get tired: they doze off. The others show a sweat drop.
    [Event]
        Name        TestSleepy
        Priority    mood
        Cooldown    1
        [Variant]
            Name    DozeOff
            RequiresSleepNeed   yes
            Emote   Z 3
            Effect  ReactionZ 3
        [/Variant]
        [Variant]
            Name    SweatDrop
            Emote   Sweat 2
        [/Variant]
    [/Event]

    [Event]
        Name        TestGroup
        Priority    event
        Cooldown    1
        GroupMax    4
        [Variant]
            Name    Cheer
            Emote   Exclamation 1.5
            Effect  ReactionSparks 0.8
            Motion  hop 1 0.2 0.5
        [/Variant]
    [/Event]
[/Events]

[/CreatureReactions]
