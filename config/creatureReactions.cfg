# Creature reactions definition file.
# Reactions are short cosmetic one-shot effects on a creature (an icon above its head, particles,
# a pose, a small hop). They are shown by each client on its own and have no influence on the
# game rules, the creature AI, the saved games or the network traffic.
#
# The file has three blocks inside [CreatureReactions] [/CreatureReactions]:
#
# [Settings]
#   MaxSimultaneous      Maximum number of reactions shown at the same time.
#   MaxCameraDistance    Creatures farther from the camera than this (world units) show nothing.
#   GroupStaggerMin/Max  Delay range in seconds between the creatures of a group that react one after the other.
#   DefaultGroup         Group used for a creature that is in no group.
#   MoodInterval         Seconds between two looks at the moods of a few creatures.
#   MoodPerTick          Number of creatures looked at each time (round robin, so every creature is looked at now
#                        and then, never every frame). Only creatures on the screen are considered.
#   MoodWalkingChance    Chance (0 to 1) that a feeling is considered for a creature that walks. Standing creatures
#                        always are.
#   ImpatientAfter       Seconds of standing idle until a creature is impatient.
#   ProudSeconds         Seconds a creature stays proud after a victory or a level up.
#   BoredAfter           Seconds of standing idle until a creature is bored.
#   AmbientAfter         Seconds of standing idle until a creature shows small habits and changes of pose.
#   SitAfter, LieAfter   Seconds of standing idle until a creature sits down, and until it lies down.
#   LookRadius           Creatures standing still closer than this (world units) to a fight, a slap or falling gold
#                        turn their head to it.
#
# [Groups]  Each [Group] has a Name and the Creatures (creature definition names) in it. A variant can
#           be limited to some groups, so that a kind of creature gets the variants that suit it.
#
# [Events]  Each [Event] is a kind of reaction with its variants. A variant is chosen at random, by weight, among
#           the variants allowed for the creature.
#   Name         Name of the event, used by the game and by the console command 'reaction'.
#   Priority     death, combat, held, event, work, mood or ambient (most to least important). A reaction
#                only starts when the creature does something less important, and a more important reaction
#                replaces a running one.
#   Cooldown     Seconds before the same creature shows this event again.
#   Probability  Chance (0 to 1) that a trigger leads to a reaction.
#   GroupMax     Maximum number of creatures that react when a whole group is triggered.
#   WhileWorking yes: the event decorates a long running animation (sleeping, digging, claiming). That animation
#                no longer counts as busy for the event, and no clip is put over it (only icon, particles and motion).
#
#   Keys of a [Variant]:
#   Name               Name of the variant.
#   Weight             Chance of the variant compared to the others.
#   Clip               Tier C: animation made for the reaction: Clip <name> [speed]
#   Fallback           Tier B: animation every creature of the mesh has: Fallback <name> [speed [start end]]
#                      start and end are fractions of the animation length. Used if Clip is missing.
#   Emote              Tier A: icon above the head: Emote <name> [seconds]. The icon is the material CreatureEmote_<name>.
#   Effect             Tier A: particle system put on the creature: Effect <name> [seconds]. Can be given several times.
#   Motion             Small movement of the model: Motion <type> <count> <amount> <seconds>
#                      hop    jumps <count> times, <amount> is the height in world units
#                      shake  trembles sideways <count> times, <amount> is the width in world units
#                      squash bends down <count> times, <amount> is the share of the size (negative: stretches up)
#                      spin   turns around <count> times (amount is not used)
#                      turn   turns to the camera, stays and turns back (count and amount are not used)
#                      look   looks left and right <count> times, <amount> is the angle in degrees
#                      lookat turns to the wall, neighbour, room or place of an event, stays and turns back
#                      sit    sinks down by the share <amount> of its height, stays and gets up
#                      lie    tips over onto its side by <amount> degrees, stays and gets up
#                      startle nods off <count> times (<amount> deep) and jumps up in the end
#                      spin, turn, squash, look, lookat, sit, startle (and lie) are only shown while the creature
#                      stands still.
#   Cooldown, Probability   Replace the values of the event for this variant.
#   Creatures, Groups, Jobs  Limit the variant to creature definitions, groups or jobs (Fighter, Worker).
#   RequiresSleepNeed  yes: only for creature types that get tired (WakefulnessLost/Turn above 0 in creatures.cfg).
#                      Used for yawning and nodding off.
#   RequiresWall       yes: only when a wall tile is next to the creature. The motion lookat turns to that wall.
#   RequiresNeighbour  yes: only when another creature is close. The motion lookat turns to it.
#   LookAtRoom         <Hatchery|Treasury|Portal|...>: only when the keeper of the creature has such a room. The
#                      motion lookat turns to the closest tile of it.
#   LateEmote          A second icon later in the variant: LateEmote <name> <delay seconds> <seconds>
#   LateEffect         A second particle effect later in the variant: LateEffect <name> <delay seconds> <seconds>
#   Prop               A small sprite prop that only exists while the variant plays:
#                      Prop <path> <sprite> <count> <size> <seconds>
#                      path    juggle (balls), yoyo, flip (coin), stack (pebbles), toss (pebble against the wall),
#                              critter, balance (tool), doodle (marks in the dust), shadow (on the wall), kick
#                      sprite  the material CreatureProp_<sprite>
#                      count   number of balls, pebbles, marks or kicks
#                      size    size of one sprite as a share of the height of the creature
#                      Props are only shown while the creature stands still, in the option 'full'.
#   Spreads            Name of an event a creature close by shows a moment later (the yawn that spreads).
#
# What is missing is skipped: no animation means the next tier, no icon or effect means that part is left out.
# Animations and poses are only shown while the creature stands still and everything but the icon
# only in the option 'Creature reactions: full'. In 'reduced' only the icon is shown, 'off' shows nothing.

[CreatureReactions]

[Settings]
    MaxSimultaneous     6
    MaxCameraDistance   45
    GroupStaggerMin     0.12
    GroupStaggerMax     0.45
    MoodInterval        0.5
    MoodPerTick         4
    MoodWalkingChance   0.3
    ImpatientAfter      6
    ProudSeconds        25
    BoredAfter          20
    AmbientAfter        3
    SitAfter            45
    LieAfter            100
    LookRadius          12
    DefaultGroup        Fighters
[/Settings]

[Groups]
    [Group]
        Name        LargeBeasts
        Creatures   Troll Wyvern Dragon PitDemon Scarab NatureMonster TentacleAlbine TentacleGreen
    [/Group]
    [Group]
        Name        SmallWorkers
        Creatures   Kobold DwarfWorker
    [/Group]
    [Group]
        Name        Fighters
        Creatures   Orc LavaSpawn LizardMan Goblin Skeleton Adventurer Dwarf1 Dwarf2 Knight RunelordDwarf Defender Kreatur
    [/Group]
    [Group]
        Name        Spellcasters
        Creatures   Cultist Lich Monk Wizard DarkElf Elf
    [/Group]
    [Group]
        Name        SmallCritters
        Creatures   Rat Roach Spider CaveHornet Slime Gnome
    [/Group]
[/Groups]

