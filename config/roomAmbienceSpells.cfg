        ##### View shake, ground marks and the end of a possession #####
        # Shake: Amount = strength in world units (felt at full strength in the middle of the view, less further away),
        # Speed = shakes per second, MaxDistance = where it is not felt any more. Not shown in the mode "reduced".
        # Mark: a flat mark on the floor for Duration seconds, at most MaxMarks at once (config/roomAmbience.cfg).

        [Effect]
            Name        SpellQuakeShake
            Target      Event
            Event       SpellFxTremor
            Kind        Shake
            Amount      0.16
            Speed       15
            Duration    1.2
