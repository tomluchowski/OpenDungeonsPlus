# Cosmetic effects of the spells, client side only. They add to the effects the creature effects bring along
# (SpellCreature... particle systems on the creatures). Format and keys: see config/roomAmbience.cfg.
# The server reports a cast with the family "SpellFx/<Name>" of an existing sound message; the client starts
# the event "SpellFx<Name>" at that tile. Purely cosmetic: nothing here changes the game, a save game or the network.

[RoomAmbience]
    [Effects]

        ##### Possession: a flash and a ring where the keeper returns to the view #####

        [Effect]
            Name        SpellPossessEndFlash
            Target      Event
            Event       SpellFxPossessEnd
            Kind        Particle
            System      SpFxPossessFlash
            Offset      0 0 0
            Duration    1.2
            MaxDistance 40
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        SpellPossessEndRing
            Target      Event
            Event       SpellFxPossessEnd
            Kind        Particle
            System      SpFxPossessRing
            Offset      0 0 0
            Duration    1.6
            MaxDistance 40
            Priority    4
            Reduced     yes
        [/Effect]

    [/Effects]
[/RoomAmbience]
