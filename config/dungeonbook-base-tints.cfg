# Colour variation of the neutral Dungeonbook bases (composed creature pictures).
#
# Same format and same code (PortraitTint) as portrait-tints.cfg, but a separate file with its own
# regions: the bases are bare, so the regions of the creature-bar paintings do not fit them.
# Every creature gets its own slightly different colours chosen from its name, the same on every machine.
#
# Format: line based, columns separated by TAB, '#' starts a comment.
#   [Palette]
#   Name<TAB>name
#   Colour<TAB>name<TAB>hue 0-360<TAB>saturation 0-1<TAB>brightness 0-1
#   [Portrait]
#   Mesh<TAB>catalog id of the base, i.e. the folder name in materials/portraits/variants: Orc.mesh-male
#   Region<TAB>name<TAB>palette=<name> or shift=hue,sat,val<TAB>box=x0,y0,x1,y1<TAB>hue=a,b<TAB>sat=a,b<TAB>val=a,b[<TAB>not=x0,y0,x1,y1,...]
#
# box and not are fractions (0 to 1) of the base image, hue is in degrees. The regions work on the
# neutral base only; the chosen parts are part of the picture when it is tinted, so a region that should
# stay clear of a part has to exclude its colours (hue, sat, val) or its box.
#
# A catalog id without a [Portrait] block, or without regions, is not tinted at all (the picture is
# shown as composed). The Dungeonbook never falls back to the old tint regions for it.
#
# The entries below are the regions of the small test bases in source/tests/fixtures/portraits.
# The regions of the real bases are added together with their artwork.

[Portrait]
Mesh	Knight.mesh-male
Region	Skin	shift=12,0.2,0.2	box=0,0,1,1	hue=0,40	sat=0.1,0.6	val=0.3,0.8

