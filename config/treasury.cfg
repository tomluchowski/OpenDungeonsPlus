# Tunable values of the treasury gold layer.
#
# Every value has a default in source/rooms/TreasurySettings.h; a missing file or a missing key keeps the
# default, a value out of range is limited. The values are read once when the game starts.
# The fill steps of a pile (7) are fixed: the step is a digit of the pile name that server and client share.
#
# Format: [Treasury], then one line per key (key and value separated by a TAB), [/Treasury]. '#' starts a comment.
#
# Keys (default in brackets):
# --- Gold layer ---
#   LevelHeight (0.055): Height of a pile corner per fill step, in tile units (0.01 - 0.2). Seven steps make a full pile.
#   MaxTopCoins (8): Single coins lying on top of a full pile (0 - 40). Thinner piles carry fewer, in even steps from TopCoinMinLevel on. Raising it costs 12 triangles per coin: keep tools/treasury-gold/check_gold_budget.py green.
#   TopCoinMinLevel (2): Lowest fill step (1 - 7) of a pile that carries coins on top.
#   MaxGems (2): Gems in the fullest piles (1 - 4); the variant of the pile decides how many, so rich rooms show 1 to MaxGems gems per tile.
#   SpillCoinsFull (1): Coins spilled at every open edge of a full pile (0 - 4).
#   ScatterCoins (3): Coins scattered on the bare floor of an empty tile that gets scatter (0 - 8).
# --- Draw batches and level of detail ---
#   BatchRebuildInterval (0.25): Seconds between two rebuilds of the draw batch of a changed room.
#   LodFarDistance (22.0): Piles farther than this from the camera, in tiles, use the reduced mesh.
#   LodHysteresis (4.0): Piles return to the full mesh below LodFarDistance minus this, so they never flip back and forth.
#   LodInterval (0.5): Seconds between two level of detail checks.
#   LodSwitchesPerUpdate (10): Piles switched at most per check, so a camera jump is spread over several checks.
#   RebuildPerFrame (40): Piles drawn again per frame after the "Treasury detail" option changed.
#
[Treasury]
# Gold layer
    LevelHeight	0.055
    MaxTopCoins	8
    TopCoinMinLevel	2
    MaxGems	2
    SpillCoinsFull	1
    ScatterCoins	3
# Draw batches and level of detail
    BatchRebuildInterval	0.25
    LodFarDistance	22.0
    LodHysteresis	4.0
    LodInterval	0.5
    LodSwitchesPerUpdate	10
    RebuildPerFrame	40
[/Treasury]
