# Tunable values of the treasury gold layer and of the effects on it.
#
# Every value has a default in source/rooms/TreasurySettings.h; a missing file or a missing key keeps the
# default, a value out of range is limited. The values are read once when the game starts.
# The fill steps of a pile (7) are fixed: the step is a digit of the pile name that server and client share.
#
# Format: [Treasury], then one line per key (key and value separated by a TAB), [/Treasury]. '#' starts a comment.
#
# Keys (default in brackets):
# --- Gold layer ---
#   LevelHeight (0.055): Height of a pile corner per fill step, in tile units (0.01 - 0.2). Seven steps make a full pile.
#   MaxTopCoins (8): Single coins lying on top of a full pile (0 - 40). Thinner piles carry fewer, in even steps from TopCoinMinLevel on. Raising it costs 12 triangles per coin: keep tools/treasury-gold/check_gold_budget.py green.
#   TopCoinMinLevel (2): Lowest fill step (1 - 7) of a pile that carries coins on top.
#   MaxGems (2): Gems in the fullest piles (1 - 4); the variant of the pile decides how many, so rich rooms show 1 to MaxGems gems per tile.
#   SpillCoinsFull (1): Coins spilled at every open edge of a full pile (0 - 4).
#   ScatterCoins (3): Coins scattered on the bare floor of an empty tile that gets scatter (0 - 8).
# --- Creatures and effects on the gold ---
#   DeepLevel (4): From this fill step on creatures splash and clink in the gold (1 - 7).
#   StepDistance (0.55): Distance a creature walks between two splashes, in tiles.
#   SplashLifetime (1.4): Seconds a splash counts against the effect budget of its room.
#   PourDuration (1.4): Seconds a worker spends climbing the pile, pouring out the gold and coming back down.
#   SplashBudgetFull (6): Splashes a room may show at once at the detail full.
#   SplashBudgetReduced (2): The same at the detail reduced.
#   AmbientInterval (0.9): Seconds between two attempts to start a sparkle, sliding coins or rolling coins.
#   AmbientLifetime (2.5): Seconds such an effect counts against the budget of its room.
#   AmbientBudgetFull (3): Sparkles, sliding and rolling coins a room may show at once at the detail full.
#   AmbientBudgetReduced (1): The same at the detail reduced.
#   SlideLevel (3): Piles of at least this step slide coins down their slope (1 - 7).
#   GlintLevel (5): Piles of at least this step sparkle (1 - 7).
#   PileSettleTime (0.7): Seconds a pile needs to settle to its new height after gold was added or taken. Objects buried in the gold settle at the same rate.
#   DentDepth (0.88): Height factor of the whole pile at the deepest point of the dip when it settles at the reduced detail (0.3 - 1).
#   DentShare (0.35): Share of the settle time (0.05 - 0.95) after which that dip is deepest.
#   DentRadius (0.3): Radius, in tiles (0.05 - 0.5), of the local dent where gold was taken at the detail full.
#   DentLocalDepth (0.08): Depth, in tiles (0 - 0.3), of that dent at its deepest point; it fills up again over the settle time.
#   BuryShareFirst (0.1): Share of its height that an object sinks into a pile of step 1.
#   BuryShareFull (0.5): The same for a full pile; the steps in between are even.
# --- Draw batches and level of detail ---
#   BatchRebuildInterval (0.25): Seconds between two rebuilds of the draw batch of a changed room.
#   LodFarDistance (22.0): Piles farther than this from the camera, in tiles, use the reduced mesh.
#   LodHysteresis (4.0): Piles return to the full mesh below LodFarDistance minus this, so they never flip back and forth.
#   LodInterval (0.5): Seconds between two level of detail checks.
#   LodSwitchesPerUpdate (10): Piles switched at most per check, so a camera jump is spread over several checks.
#   RebuildPerFrame (12): Piles and floor gold heaps rebuilt per frame after the treasury detail option changed in the settings.
#
[Treasury]
# Gold layer
    LevelHeight	0.055
    MaxTopCoins	8
    TopCoinMinLevel	2
    MaxGems	2
    SpillCoinsFull	1
    ScatterCoins	3
# Creatures and effects on the gold
    DeepLevel	4
    StepDistance	0.55
    SplashLifetime	1.4
    PourDuration	1.4
    SplashBudgetFull	6
    SplashBudgetReduced	2
    AmbientInterval	0.9
    AmbientLifetime	2.5
    AmbientBudgetFull	3
    AmbientBudgetReduced	1
    SlideLevel	3
    GlintLevel	5
    PileSettleTime	0.7
    DentDepth	0.88
    DentShare	0.35
    DentRadius	0.3
    DentLocalDepth	0.08
    BuryShareFirst	0.1
    BuryShareFull	0.5
# Draw batches and level of detail
    BatchRebuildInterval	0.25
    LodFarDistance	22.0
    LodHysteresis	4.0
    LodInterval	0.5
    LodSwitchesPerUpdate	10
    RebuildPerFrame	12
[/Treasury]
