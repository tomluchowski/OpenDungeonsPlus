# Texts for the creature social profiles ("Dungeonbook").
#
# Format: line based, columns separated by TAB, '#' starts a comment. Values may contain spaces.
#   ClassName  class           readable name of the class (one per class)
#   Job        class           text
#   Like       scope           text
#   Dislike    scope           text
#   Quirk      scope           text
#   Bio        scope           text (template)
#   Relation   scope           text
#   MoodLine   state   scope   text
#   Post       category scope  text
# scope: "*" (everybody), a group name of social-names.cfg, a creature class name,
# "worker" or "fighter".
# Slots in texts: {name} {hometown} {job} {like} {dislike} {quirk} {level} {room} {friend}.
# A slot without a value is removed.
# MoodLine states: Hungry Tired GetFee LeaveDungeon KoTemp InJail Happy Neutral Upset Angry Furious Unknown.
# Post categories: eat sleep train work fight hurt levelup payday unhappy ko jail pickedup slapped
# arrived left died idle.
#
# Profiles are derived from the creature name only; the order of the lines in this file
# is part of that derivation. Appending lines keeps most profiles, inserting or removing
# lines reshuffles them. All texts are invented for this game.

