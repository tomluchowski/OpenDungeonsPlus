# Room ambience of the other rooms and of things that lie around: casino, guard room, portal wave,
# gold and gem seams, a finished research book and gift boxes.
# Format and keys: see config/roomAmbience.cfg. Offsets are for the object as it is modelled and
# turn with the object. "Reduced yes" effects are also shown in the mode "reduced".
# Sparks, glints, glows, smoke and dust are the systems of the other room ambience files.

[RoomAmbience]
    [Effects]
        ##### Casino #####

        # Idle: the roulette turns now and then (its own clip), chips glint, the taps glow, warm light on the floor
        [Effect]
            Name        CasinoRouletteTurns
            Target      Object
            Match       Roulette
            When        Always
            Kind        Clip
            Clips       Triggered
            Every       16
            MaxDistance 22
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CasinoChipsGlint
            Target      Object
            Match       CasinoPokerTable
            When        Always
            Kind        Particle
            System      RoomAmbGoldGlint
            Offset      0 0 0.5
            MaxDistance 18
            Priority    3
        [/Effect]

        [Effect]
            Name        CasinoTapGlow
            Target      Object
            Match       CasinoWallBeer
            When        Always
            Kind        Particle
            System      RoomAmbCandleGlow
            Offset      0 0.45 0.9
            Flicker     0.15
            MaxDistance 20
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CasinoLights
            Target      Tile
            Match       casinoRoom
            When        Always
            Kind        Particle
            System      RoomAmbLanternPool
            Flicker     0.1
            Spacing     5
            MaxDistance 22
            Priority    2
        [/Effect]

        # In operation: the roulette spins again and again, coins slide on the table, smoke rises, the taps drip
        [Effect]
            Name        CasinoRouletteBusy
            Target      Object
            Match       Roulette
            When        Occupied
            Kind        Clip
            Clips       Triggered
            Every       3.5
            MaxDistance 22
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CasinoTableCoins
            Target      Object
            Match       CasinoPokerTable
            When        Occupied
            Kind        Particle
            System      RoomAmbCoinSlide
            Offset      0 0 0.5
            MaxDistance 18
            Priority    4
        [/Effect]

        [Effect]
            Name        CasinoSmoke
            Target      Object
            Match       CasinoPokerTable
            When        Occupied
            Kind        Particle
            System      RoomAmbIncense
            Offset      0 0 0.55
            MaxDistance 16
            Priority    3
        [/Effect]

        [Effect]
            Name        CasinoTapDrip
            Target      Object
            Match       CasinoWallBeer
            When        Occupied
            Kind        Particle
            System      RoomAmbTapDrip
            MaxDistance 14
            Priority    3
        [/Effect]

        ##### Guard room #####

        # Idle: lantern light, dust in the light, glints on the weapons
        [Effect]
            Name        GuardRoomLight
            Target      Tile
            Match       guardRoom
            When        Always
            Kind        Particle
            System      RoomAmbGuardLight
            Flicker     0.1
            Spacing     5
            MaxDistance 24
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        GuardRoomMotes
            Target      Tile
            Match       guardRoom
            When        Always
            Kind        Particle
            System      RoomAmbMotes
            Spacing     4
            MaxDistance 18
            Priority    1
        [/Effect]

        [Effect]
            Name        GuardRoomGlints
            Target      Tile
            Match       guardRoom
            When        Always
            Kind        Particle
            System      RoomAmbIronGlint
            Spacing     4
            MaxDistance 16
            Priority    1
        [/Effect]

        # In operation: stamping feet raise dust while a guard is on duty
        [Effect]
            Name        GuardRoomOnDuty
            Target      Tile
            Match       guardRoom
            When        Occupied
            Kind        Particle
            System      RoomAmbHitDust
            Offset      0 0 0.1
            Spacing     3
            MaxDistance 18
            Priority    4
        [/Effect]

        ##### Portal wave #####

        # Idle: a hostile swirl, red light on the floor, sparks flying up
        [Effect]
            Name        WaveSwirl
            Target      Tile
            Match       portalWaveRoom
            When        Always
            Kind        Particle
            System      RoomAmbWaveSwirl
            MaxDistance 36
            Priority    7
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WaveGlow
            Target      Tile
            Match       portalWaveRoom
            When        Always
            Kind        Particle
            System      RoomAmbWaveGlow
            Flicker     0.12
            Speed       0.8
            MaxDistance 32
            Priority    6
        [/Effect]

        [Effect]
            Name        WaveSparks
            Target      Tile
            Match       portalWaveRoom
            When        Always
            Kind        Particle
            System      RoomAmbWaveSparks
            MaxDistance 26
            Priority    5
        [/Effect]

        # In operation: a burst of sparks while a creature is close (the arrival flash is in roomAmbienceCoreObjects.cfg)
        [Effect]
            Name        WaveOccupied
            Target      Tile
            Match       portalWaveRoom
            When        Occupied
            Kind        Particle
            System      RoomAmbSparkBurst
            Offset      0 0 0.5
            MaxDistance 26
            Priority    5
        [/Effect]

        ##### Seams, a finished book, gift boxes #####

        [Effect]
            Name        GoldSeamGlint
            Target      Tile
            Match       goldFull
            When        Always
            Kind        Particle
            System      RoomAmbSeamGlint
            Spacing     4
            MaxDistance 14
            Priority    1
        [/Effect]

        [Effect]
            Name        GemSeamGlint
            Target      Tile
            Match       gemFull
            When        Always
            Kind        Particle
            System      RoomAmbGemGlint
            Spacing     3
            MaxDistance 14
            Priority    1
        [/Effect]

        [Effect]
            Name        FinishedBookGlow
            Target      Object
            Match       Grimoire
            When        Always
            Kind        Particle
            System      RoomAmbGrimoireGlow
            Offset      0 0 0.3
            Flicker     0.25
            Speed       0.6
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        FinishedBookRunes
            Target      Object
            Match       Grimoire
            When        Always
            Kind        Particle
            System      RoomAmbRunes
            Offset      0 0 0.6
            MaxDistance 16
            Priority    2
        [/Effect]

        [Effect]
            Name        GiftBoxGlow
            Target      Object
            Match       MysteryBox
            When        Always
            Kind        Particle
            System      RoomAmbGiftGlow
            Offset      0 0 0.4
            Flicker     0.2
            Speed       0.7
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        GiftBoxGlint
            Target      Object
            Match       MysteryBox
            When        Always
            Kind        Particle
            System      RoomAmbGiftGlint
            MaxDistance 18
            Priority    3
        [/Effect]
    [/Effects]
[/RoomAmbience]
