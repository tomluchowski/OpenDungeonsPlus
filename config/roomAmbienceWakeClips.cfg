# Room ambience clips of the sleep and the wake-up: beds that breathe, crypt objects that stir and a creature that
# stretches. Format and keys: see config/roomAmbience.cfg. Client side only; nothing is sent over the network.
# Every clip is played only if the skeleton of the mesh has it, otherwise nothing happens (quietly):
#   Sleep    beds and crypt objects: loops (about 2.4 s for a bed, about 3 s for the crypt) and starts and ends in the
#            pose at rest, so it can be stopped at any end of a cycle
#   Wake     beds (about 1.6 s) and crypt objects (about 1.8 s): plays once and ends in the pose at rest
#   Stretch  creatures (about 1.5 s): plays once, then the creature goes on with its idle clip
# The events are the ones of the particles beside them: CreatureWoke (a creature gets up from its bed in a
# dormitory, effects DormitoryWakeBlanket and DormitoryWakeLight in roomAmbienceGaps.cfg) and CryptRaised (a creature
# appears on a tile of a crypt, effect CryptRaiseEarth in roomAmbienceFixEffects.cfg).

[RoomAmbience]
    [Effects]
        ##### Dormitory #####

        # As long as a creature sleeps close to the bed the blanket rises and falls
        [Effect]
            Name        DormitoryBedSleepClip
            Target      Object
            Match       *Bed Hammock
            When        Sleeping
            Kind        Clip
            Clips       Sleep
            Loop        yes
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        # The creature gets up: the nearest bed throws back its blanket ...
        [Effect]
            Name        DormitoryWakeBedClip
            Target      Event
            Event       CreatureWoke
            Match       dormitoryRoom
            Kind        Clip
            Object      *Bed Hammock
            Clips       Wake
            Amount      2.5
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        # ... and the creature stretches
        [Effect]
            Name        DormitoryWakeStretch
            Target      Event
            Event       CreatureWoke
            Match       dormitoryRoom
            Kind        CreatureClip
            Clips       Stretch
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        ##### Crypt #####

        # Calm movement of the lids and the statues as long as the room stands
        [Effect]
            Name        CryptSleepClip
            Target      Object
            Match       StoneCoffin KnightCoffin KnightStatue KnightStatue2
            When        Always
            Kind        Clip
            Clips       Sleep
            Loop        yes
            MaxDistance 18
            Priority    2
            Reduced     yes
        [/Effect]

        # A creature is raised: the nearest coffin or statue wakes
        [Effect]
            Name        CryptWakeClip
            Target      Event
            Event       CryptRaised
            Match       cryptRoom
            Kind        Clip
            Object      StoneCoffin KnightCoffin KnightStatue KnightStatue2
            Clips       Wake
            Amount      3
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
