# Extra room effects: unmade beds, altar fire, rats and turning gears. Client side only, nothing here changes the game.
# Format and keys: see config/roomAmbience.cfg. New keys used here:
#   When Vacated   the target was used while it was in view and has been empty for "After" seconds
#   WallSide yes   tiles: the effect sits at the edge of the tile that touches a wall (implies NeedWall)
# Rats and altar fire are tile effects with a spacing, so only some tiles get one.

[RoomAmbience]
    [Effects]
        ##### Dormitory: the blanket stays rumpled after the sleeper got up #####

        [Effect]
            Name        DormitoryUnmadeBed
            Target      Object
            Match       *Bed
            When        Vacated
            Kind        Particle
            System      RoomAmbRumple
            After       6
            Offset      0 0 0.5
            MaxDistance 14
            Priority    3
        [/Effect]

        ##### Temple: sacred fire on the floor, a bell rings when someone is healed #####

        [Effect]
            Name        TempleAltarFlame
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbAltarFlame
            Offset      0 0 0.1
            Flicker     0.22
            Speed       2.1
            Spacing     9
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleAltarGlow
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbEmberGlow
            Offset      0 0 0.55
            Flicker     0.25
            Speed       1.9
            Spacing     9
            MaxDistance 18
            Priority    3
        [/Effect]

        [Effect]
            Name        TempleAltarEmbers
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbEmbers
            Offset      0 0 0.5
            Spacing     9
            MaxDistance 14
            Priority    2
        [/Effect]

        ##### Prison: rats run along the walls #####

        [Effect]
            Name        PrisonRatRight
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbRatRight
            Spacing     7
            WallSide    yes
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        PrisonRatLeft
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbRatLeft
            Spacing     7
            WallSide    yes
            MaxDistance 14
            Priority    2
        [/Effect]

        ##### Workshop: cogs turn while the machine is worked #####

        [Effect]
            Name        WorkshopGearBig
            Target      Object
            Match       WorkshopMachine1 WorkshopMachine2
            When        Occupied
            Kind        Particle
            System      RoomAmbGearBig
            Offset      -0.18 0 0.95
            MaxDistance 16
            Priority    5
        [/Effect]

        [Effect]
            Name        WorkshopGearSmall
            Target      Object
            Match       WorkshopMachine1 WorkshopMachine2
            When        Occupied
            Kind        Particle
            System      RoomAmbGearSmall
            Offset      0.16 0 0.95
            MaxDistance 16
            Priority    5
        [/Effect]
    [/Effects]
[/RoomAmbience]
