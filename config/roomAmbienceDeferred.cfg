# Extra room effects: unmade beds, altar fire and bell, rats, turning gears, the hurt heart and the converted flash.
# Client side only, nothing here changes the game.
# Format and keys: see config/roomAmbience.cfg. New keys used here:
#   When Vacated   the target was used while it was in view and has been empty for "After" seconds
#   WallSide yes   tiles: the effect sits at the edge of the tile that touches a wall (implies NeedWall)
#   Sound <family> events: sound family played when the effect starts (only in the mode "full")
# The events TempleHealed, ConvertedFlash, HeartHurt and HeartLowBeat are started by the client from what it already
# knows (health stage, seat, heart health).
# Rats and altar fire are tile effects with a spacing, so only some tiles get one.

[RoomAmbience]
    [Effects]
        ##### Dormitory: the blanket stays rumpled after the sleeper got up #####

        [Effect]
            Name        DormitoryUnmadeBed
            Target      Object
            Match       *Bed
            When        Vacated
            Kind        Particle
            System      RoomAmbRumple
            After       6
            Offset      0 0 0.5
            MaxDistance 14
            Priority    3
        [/Effect]

        ##### Temple: sacred fire on the floor, a bell rings when someone is healed #####

        [Effect]
            Name        TempleAltarFlame
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbAltarFlame
            Offset      0 0 0.1
            Flicker     0.22
            Speed       2.1
            Spacing     9
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleAltarGlow
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbEmberGlow
            Offset      0 0 0.55
            Flicker     0.25
            Speed       1.9
            Spacing     9
            MaxDistance 18
            Priority    3
        [/Effect]

        [Effect]
            Name        TempleAltarEmbers
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbEmbers
            Offset      0 0 0.5
            Spacing     9
            MaxDistance 14
            Priority    2
        [/Effect]

        ##### Prison: rats run along the walls #####

        [Effect]
            Name        PrisonRatRight
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbRatRight
            Spacing     7
            WallSide    yes
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        PrisonRatLeft
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbRatLeft
            Spacing     7
            WallSide    yes
            MaxDistance 14
            Priority    2
        [/Effect]

        ##### Workshop: cogs turn while the machine is worked #####

        [Effect]
            Name        WorkshopGearBig
            Target      Object
            Match       WorkshopMachine1 WorkshopMachine2
            When        Occupied
            Kind        Particle
            System      RoomAmbGearBig
            Offset      -0.18 0 0.95
            MaxDistance 16
            Priority    5
        [/Effect]

        [Effect]
            Name        WorkshopGearSmall
            Target      Object
            Match       WorkshopMachine1 WorkshopMachine2
            When        Occupied
            Kind        Particle
            System      RoomAmbGearSmall
            Offset      0.16 0 0.95
            MaxDistance 16
            Priority    5
        [/Effect]

        [Effect]
            Name        TempleGongRing
            Target      Event
            Event       TempleHealed
            Kind        Particle
            System      RoomAmbGongRing
            Duration    2.5
            Sound       Rooms/Temple/Gong
            MaxDistance 30
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleBellSparks
            Target      Event
            Event       TempleHealed
            Kind        Particle
            System      RoomAmbBellSparks
            Duration    2.2
            MaxDistance 26
        [/Effect]

        ##### Torture room and prison: a prisoner changed sides #####

        [Effect]
            Name        ConvertedFlash
            Target      Event
            Event       ConvertedFlash
            Kind        Particle
            System      RoomAmbConvertFlash
            Duration    1.2
            MaxDistance 34
            Reduced     yes
        [/Effect]

        [Effect]
            Name        ConvertedRing
            Target      Event
            Event       ConvertedFlash
            Kind        Particle
            System      RoomAmbConvertRing
            Duration    1.6
            MaxDistance 30
        [/Effect]

        [Effect]
            Name        ConvertedSparks
            Target      Event
            Event       ConvertedFlash
            Kind        Particle
            System      RoomAmbSparkBurst
            Offset      0 0 0.8
            Duration    1.5
            MaxDistance 28
        [/Effect]

        ##### Dungeon heart: a hurt heart pulses red and drops embers #####

        [Effect]
            Name        HeartHurtPulse
            Target      Event
            Event       HeartHurt
            Kind        Particle
            System      RoomAmbHeartPulse
            Duration    1.2
            MaxDistance 40
            Reduced     yes
        [/Effect]

        [Effect]
            Name        HeartHurtDrops
            Target      Event
            Event       HeartHurt
            Kind        Particle
            System      RoomAmbHeartDrops
            Duration    1.5
            MaxDistance 30
        [/Effect]

        # Below a third of the heart health every beat is heard as well (the sound of the heart hit is reused)
        [Effect]
            Name        HeartLowBeatSound
            Target      Event
            Event       HeartLowBeat
            Kind        Sound
            Family      Rooms/Heart/Hit
            MaxDistance 40
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
