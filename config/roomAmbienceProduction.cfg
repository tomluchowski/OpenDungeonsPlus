# Room ambience of the production rooms: workshop, library, training hall, treasury, hatchery.
# Format and keys: see config/roomAmbience.cfg. Offsets are for the object as it is modelled and
# turn with the object. "Reduced yes" effects are also shown in the mode "reduced".

[RoomAmbience]
    [Effects]
        ##### Workshop #####

        # Idle: smoke from the chimneys, the glow of the fire, embers, the bellows breathing
        [Effect]
            Name        WorkshopForgeSmoke
            Target      Object
            Match       Chimney
            When        Always
            Kind        Particle
            System      RoomAmbForgeSmoke
            Offset      0 0.35 1.55
            MaxDistance 24
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WorkshopForgeGlow
            Target      Object
            Match       Chimney
            When        Always
            Kind        Particle
            System      RoomAmbEmberGlow
            Offset      0 0.3 0.4
            Flicker     0.25
            MaxDistance 24
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WorkshopForgeEmbers
            Target      Object
            Match       Chimney
            When        Always
            Kind        Particle
            System      RoomAmbEmbers
            Offset      0 0.3 0.5
            MaxDistance 18
            Priority    3
        [/Effect]

        [Effect]
            Name        WorkshopBellows
            Target      Object
            Match       Chimney
            When        Always
            Kind        Motion
            Motion      Pulse
            Amount      0.012
            Speed       0.45
            MaxDistance 24
            Priority    2
            Reduced     yes
        [/Effect]

        # In operation: sparks at the anvil and the grindstone, steam and rattling machines
        [Effect]
            Name        WorkshopAnvilSparks
            Target      Object
            Match       Anvil
            When        Occupied
            Kind        Particle
            System      RoomAmbAnvilSparks
            Offset      0 0 0.8
            MaxDistance 22
            Priority    6
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WorkshopGrindSparks
            Target      Object
            Match       Grindstone
            When        Occupied
            Kind        Particle
            System      RoomAmbGrindSparks
            Offset      0 0.25 0.85
            MaxDistance 22
            Priority    6
        [/Effect]

        [Effect]
            Name        WorkshopMachineSteam
            Target      Object
            Match       WorkshopMachine1 WorkshopMachine2
            When        Occupied
            Kind        Particle
            System      RoomAmbSteam
            Offset      0 0 0.7
            MaxDistance 20
            Priority    4
        [/Effect]

        [Effect]
            Name        WorkshopMachineRattle
            Target      Object
            Match       WorkshopMachine1
            When        Occupied
            Kind        Motion
            Motion      Sway
            Axis        0 1 0
            Amount      0.7
            Speed       5
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        # Finished: a puff of steam, a flash and sparks where the part appears
        [Effect]
            Name        WorkshopCraftedSteam
            Target      Event
            Event       ItemCrafted
            Match       workshopRoom
            Kind        Particle
            System      RoomAmbCraftedSteam
            Offset      0 0 0.3
            Duration    2.5
            MaxDistance 32
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WorkshopCraftedFlash
            Target      Event
            Event       ItemCrafted
            Match       workshopRoom
            Kind        Particle
            System      RoomAmbFlash
            Offset      0 0 0.4
            Duration    1.5
            MaxDistance 32
        [/Effect]

        [Effect]
            Name        WorkshopCraftedSparks
            Target      Event
            Event       ItemCrafted
            Match       workshopRoom
            Kind        Particle
            System      RoomAmbSparkBurst
            Offset      0 0 0.4
            Duration    1.5
            MaxDistance 32
        [/Effect]

        ##### Library #####

        # Idle: lamp light on the desks, runes in the air, a book that glows, dust in the light
        [Effect]
            Name        LibraryLampGlow
            Target      Object
            Match       Podium
            When        Always
            Kind        Particle
            System      RoomAmbCandleGlow
            Offset      0 0 0.75
            Flicker     0.2
            MaxDistance 24
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        LibraryLampGlowTall
            Target      Object
            Match       Bookcase
            When        Always
            Kind        Particle
            System      RoomAmbCandleGlow
            Offset      0 0 1.3
            Flicker     0.2
            MaxDistance 24
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        LibraryRunes
            Target      Object
            Match       Podium Bookcase
            When        Always
            Kind        Particle
            System      RoomAmbRunes
            Offset      0 0 1.0
            MaxDistance 20
            Priority    3
        [/Effect]

        [Effect]
            Name        LibraryBookGlow
            Target      Object
            Match       Bookshelf
            When        Always
            Kind        Particle
            System      RoomAmbBookGlow
            Offset      0 0.2 1.0
            MaxDistance 18
            Priority    2
        [/Effect]

        [Effect]
            Name        LibraryMotes
            Target      Tile
            Match       libraryRoom
            When        Always
            Kind        Particle
            System      RoomAmbMotes
            Spacing     3
            MaxDistance 20
            Priority    2
        [/Effect]

        # In operation: pages that turn by themselves while someone reads
        [Effect]
            Name        LibraryPages
            Target      Object
            Match       Podium Bookcase
            When        Occupied
            Kind        Particle
            System      RoomAmbPages
            Offset      0 0 0.8
            MaxDistance 20
            Priority    5
        [/Effect]

        # Finished: a column of light, swirling pages
        [Effect]
            Name        LibraryResearchPillar
            Target      Event
            Event       ResearchDone
            Match       libraryRoom
            Kind        Particle
            System      RoomAmbLightPillar
            Offset      0 0 0
            Duration    2.5
            MaxDistance 34
            Reduced     yes
        [/Effect]

        [Effect]
            Name        LibraryResearchPages
            Target      Event
            Event       ResearchDone
            Match       libraryRoom
            Kind        Particle
            System      RoomAmbPageSwirl
            Offset      0 0 0.3
            Duration    3.0
            MaxDistance 34
        [/Effect]

        ##### Training hall #####

        # Idle: dummies creak and swing, old straw trickles
        [Effect]
            Name        TrainingDummyCreak
            Target      Object
            Match       TrainingDummy1 TrainingDummy3
            When        Always
            Kind        Motion
            Motion      Wobble
            Axis        1 0 0
            Amount      1.4
            Speed       0.9
            MaxDistance 24
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TrainingDummyPendulum
            Target      Object
            Match       TrainingDummy2 TrainingDummy4
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        1 0 0
            Amount      2.2
            Speed       0.3
            MaxDistance 24
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TrainingDummyStraw
            Target      Object
            Match       TrainingDummy1 TrainingDummy2 TrainingDummy3 TrainingDummy4
            When        Always
            Kind        Particle
            System      RoomAmbDummyDust
            MaxDistance 16
            Priority    2
        [/Effect]

        # In operation: the dummies are hit and spring back (their own clip), dust and sweat fly
        [Effect]
            Name        TrainingDummyHit
            Target      Object
            Match       TrainingDummy1 TrainingDummy2 TrainingDummy3 TrainingDummy4
            When        Occupied
            Kind        Clip
            Clips       Triggered
            Every       3.5
            MaxDistance 24
            Priority    7
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TrainingHitDust
            Target      Object
            Match       TrainingDummy1 TrainingDummy2 TrainingDummy3 TrainingDummy4
            When        Occupied
            Kind        Particle
            System      RoomAmbHitDust
            Offset      0 0 0.1
            MaxDistance 20
            Priority    5
        [/Effect]

        [Effect]
            Name        TrainingSweat
            Target      Object
            Match       TrainingDummy1 TrainingDummy2 TrainingDummy3 TrainingDummy4
            When        Occupied
            Kind        Particle
            System      RoomAmbSweat
            Offset      0 0.3 0
            MaxDistance 14
            Priority    4
        [/Effect]

        ##### Treasury #####

        # The piles of a treasury are named TreasuryGold_<level>_<corners>_<variant> (level 1 to 7); the classic
        # GoldstackLv names only remain on the ring around the dungeon heart. The client draws the sparkle of rich
        # piles (level 5 and up), the sliding coins (level 3 and up), the glow and the gold dust of full piles itself,
        # so none of that is listed here again. This file only adds what the client does not do: the glitter of the
        # middle piles (level 3 and 4) when idle, and of every pile a worker stands at.

        # Idle: glitter on the middle heaps
        [Effect]
            Name        TreasuryGlint
            Target      Object
            Match       GoldstackLv2
            When        Always
            Kind        Particle
            System      RoomAmbGoldGlint
            Offset      0 0 0.2
            MaxDistance 22
            Priority    4
        [/Effect]

        # In operation: a worker at a heap makes it glitter
        [Effect]
            Name        TreasuryWorkerGlitter
            Target      Object
            Match       GoldstackLv1 GoldstackLv2 GoldstackLv3
            When        Occupied
            Kind        Particle
            System      RoomAmbGoldGlintRich
            Offset      0 0 0.2
            MaxDistance 20
            Priority    6
            Reduced     yes
        [/Effect]

        # Finished: gold is put in, coins rain down
        [Effect]
            Name        TreasuryCoinRain
            Target      Event
            Event       GoldDeposited
            Match       treasuryRoom
            Kind        Particle
            System      RoomAmbCoinRain
            Offset      0 0 0
            Duration    2.5
            Chance      0.8
            MaxDistance 30
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TreasuryDepositGlint
            Target      Event
            Event       GoldDeposited
            Match       treasuryRoom
            Kind        Particle
            System      RoomAmbSparkBurst
            Offset      0 0 0.2
            Duration    1.5
            Chance      0.8
            MaxDistance 30
        [/Effect]

        ##### Hatchery #####

        # Straw dust at the coop, the coop creaking, a hen scratching (grain, the coop house and feathers come with the hatchery)
        [Effect]
            Name        HatcheryStrawDust
            Target      Object
            Match       ChickenCoop
            When        Always
            Kind        Particle
            System      RoomAmbStrawDust
            Offset      0.3 0 0.15
            MaxDistance 18
            Priority    2
        [/Effect]

        [Effect]
            Name        HatcheryCoopCreak
            Target      Object
            Match       ChickenCoop
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        0 1 0
            Amount      0.5
            Speed       0.35
            MaxDistance 22
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        HatcheryChickenScratch
            Target      Object
            Match       Chicken
            When        Always
            Kind        Clip
            Clips       Paw
            Every       8
            MaxDistance 20
            Priority    3
            Reduced     yes
        [/Effect]

        ##### Decorations: tools on the workshop wall, weapon racks in the training hall #####
        [Effect]
            Name        WorkshopWallTools
            Target      Tile
            Match       workshopRoom
            When        Always
            Kind        Model
            Mesh        WallTools.mesh
            WallSide    yes
            Spacing     4
            Offset      0 0 1.1
            Motion      Wobble
            Axis        0 1 0
            Amount      4
            Speed       0.9
            MaxDistance 16
            Priority    1
        [/Effect]

        [Effect]
            Name        TrainingWeaponRack
            Target      Tile
            Match       trainingHallRoom
            When        Always
            Kind        Model
            Mesh        WeaponRack.mesh
            WallSide    yes
            Spacing     5
            Amount      0
            MaxDistance 16
            Priority    1
        [/Effect]
    [/Effects]
[/RoomAmbience]
