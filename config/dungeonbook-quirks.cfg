# Dungeonbook profile remarks: dry quips that match the parts of a creature's picture.
#
# Format: line based, columns separated by TAB, '#' starts a comment.
#
#   <slot> TAB <option name> TAB <text>
#
# Slot and option name are the ones used in the portrait manifests (materials/portraits/variants/<catalog id>/manifest.cfg).
# The entries cover every slot and option name of the shipped manifests. An entry that names a part that does not exist is simply never shown. A part without an entry has no remark.
# At most two remarks are shown per creature. Which ones is derived from the creature name and its look with a fixed
# hash, so every player sees the same remarks and nothing is saved or sent. Creatures without a composed picture
# show no remarks. Keep the texts short and without a gender (they are shown for every creature).

# Eyes
eyes	eyepatch	Collects eye patches, green ones only.
eyes	narrow	Squints at every promise and most of the furniture.
eyes	round	Looks permanently surprised that the dungeon is still standing.

# Mouth
mouth	cigar	Hates it when someone asks to put it out.
mouth	grin	Smiles at bad news, which makes the news worse.
mouth	scowl	Has not forgiven the last three masters, and keeps count.
mouth	teeth	Insists the teeth are all original, and nobody asked.
mouth	tusks	Uses the tusks as a coat hook when nobody is looking.

# Scars
scar	diagonal	Tells a different story about the scar every time.
scar	scratches	Blames the scratches on a cat that nobody has ever seen.
scar	warpaint	Reapplies the war paint before every nap.

# Neck
neck	pin	Wears a pin that is worth nothing and is guarded like a treasury.
neck	teeth	Wears a necklace of teeth and gets touchy when asked whose.
neck	tooth	Wears a single tooth on a string and a lot of silence around it.
neck	torque	Polishes the torque more often than the weapons.

# Hair
hair	swept	Spends longer on the hair than on the battle plan.
hair	waves	Will not walk into a fight with the hair wet.
hair	braid	Braids a new knot for every enemy and has run out of string.
hair	loose	Has lost three combs in the dungeon and suspects the walls.
hair	mossbraids	Grows moss in the braids and calls it a garden.
hair	mossstrands	Is sure the moss in the hair is a friend.
hair	shortfrill	Keeps the frill neat for the one day somebody visits.
hair	wavefrill	Lets the frill ripple when pleased, which is rarely.

# Chin and beard
chin	braided	Braids the beard and expects applause.
chin	forked	Forks the beard for luck and trips on it for balance.
chin	rounded	Rests the rounded chin on any wall that stands still.
chin	square	Leads with the square chin and lets the body catch up.

# Ears and nose
ears	notched	Says the notches are from battle, the barber says otherwise.
ears	rounder	Hears every rumour in the dungeon a day early.
nose	broad	Can smell the cook's mistakes two rooms away.
nose	crooked	Was told the nose points to treasure, and follows it.

# Build
build	slim	Squeezes through gaps nobody else knew were gaps.
build	sturdy	Is built like a door and treated like one.

# Outfit
outfit	leather	Oils the leather jerkin every night, the sword gets a blanket.
outfit	chain	Sleeps in the chain mail and jingles in the dreams.
outfit	padded	Pads the armour with spare socks, officially for protection.
outfit	apron	Wears an apron to battle so the stains need no excuse.
outfit	plate	Refuses to take off the plate armour, even for stairs.
outfit	patched	Knows the story behind every patch and tells all of them.
outfit	robe	Trips on the robe on the stairs and calls it a tactical retreat.
outfit	tunic	Keeps the tunic clean by never standing near anything exciting.

# Helmet
helmet	arch	Wears the arched helm like a door nobody may pass.
helmet	barrel	Calls the barrel on the head a helmet with excellent ventilation.
helmet	bascinet	Keeps the visor shut so nobody learns what the opinions are.
helmet	crown	Wears the crown to work and has never once been asked about it.
helmet	greathelm	Has not seen the sky in years, only the inside of the greathelm.
helmet	horned	Is proud of the horns and furious about every doorframe.
helmet	houndskull	Wears a hound skull and swears it was a gift, not a trophy.
helmet	ridged	Counts the helm ridges for luck and loses count on purpose.
