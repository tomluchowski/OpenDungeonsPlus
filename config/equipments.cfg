# Equipment definition file.
# An equipment can be used on a creature to improve its stats.
# Each Equipment is defined with [EquipmentDefinitions] [/EquipmentDefinitions]
# within a [Equipment] [/Equipment] tag couple.
#
# Supported stats:
# Name             (Must be unique without spaces) The Equipment definition name.
# MeshName         Ogre mesh to be displayed in the .mesh format
#                  "none" means the weapon is already part of the creature model (nothing is attached).
# PhysicalDamage   Maximum physical damage
# PhysicalDamageMin Optional minimum physical damage (default maximum)
# MagicalDamage    Maximum magical damage
# MagicalDamageMin Optional minimum magical damage (default maximum)
# ElementDamage    Maximum element damage
# ElementDamageMin Optional minimum element damage (default maximum)
# AttackRating     Optional attack rating bonus (default 0)
# DefenseRating    Optional defense rating bonus (default 0)
# CooldownNbTurns (Optional, weapons only) Melee cooldown in turns for a creature that carries this weapon.
#                  With two weapons the larger value counts. Without a weapon the cooldown of the Melee skill in
#                  creatures.cfg applies. Positive whole number. Shields and other non-weapons have no such field and
#                  do not take part in the choice. Ranged skills do not use it. The cooldown shrinks by 0.75 percent per
#                  creature level above 1 (not rounded, never below 1 turn).
# ParryBase       (Optional, weapons only) Parry chance in percent of a creature that carries this weapon: base value,
# ParryPerLevel    added per creature level, and ParryMax, the highest chance. With two weapons the larger chance counts.
#                  A weapon without these fields uses ParryBase, ParryPerLevel and ParryMax of global.cfg. Only the
#                  configured creature avoidance kind applies. Shields have no parry fields.
# PhysicalDefense  Physical defense
# MagicalDefense   Magical defense
# ElementDefense   Elemental defense

