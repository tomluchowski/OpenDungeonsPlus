# Room ambience of the care rooms: dormitory, temple, prison, torture room, crypt, arena.
# Format and keys: see config/roomAmbience.cfg. Offsets are for the object as it is modelled and
# turn with the object. "Reduced yes" effects are also shown in the mode "reduced".
# Fire, smoke, steam and spark systems are the ones of roomAmbienceProduction.cfg.

[RoomAmbience]
    [Effects]
        ##### Dormitory #####

        # Idle: a pool of lantern light, dust in the warm light, creaking beds
        [Effect]
            Name        DormitoryLanternPool
            Target      Tile
            Match       dormitoryRoom
            When        Always
            Kind        Particle
            System      RoomAmbLanternPool
            Flicker     0.1
            Spacing     6
            MaxDistance 24
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        DormitoryMotes
            Target      Object
            Match       *Bed Hammock
            When        Always
            Kind        Particle
            System      RoomAmbMotes
            Offset      0 0 0.3
            MaxDistance 16
            Priority    1
        [/Effect]

        [Effect]
            Name        DormitoryBedCreak
            Target      Object
            Match       *Bed Hammock
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        0 1 0
            Amount      0.8
            Speed       0.3
            MaxDistance 20
            Priority    2
            Reduced     yes
        [/Effect]

        # In operation: someone sleeps, Z rises and the blanket rises and falls
        [Effect]
            Name        DormitorySleepZ
            Target      Object
            Match       *Bed Hammock
            When        Occupied
            Kind        Particle
            System      RoomAmbSleepZ
            Offset      0 -0.1 0.7
            MaxDistance 20
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        DormitoryBreathing
            Target      Object
            Match       *Bed Hammock
            When        Occupied
            Kind        Motion
            Motion      Pulse
            Amount      0.012
            Speed       0.28
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        ##### Temple #####

        # Idle: incense, a shaft of light, pulsing floor runes
        [Effect]
            Name        TempleIncense
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbIncense
            Offset      0 0 0.2
            Spacing     5
            MaxDistance 24
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleLightShaft
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbHolyRay
            Flicker     0.08
            Spacing     6
            MaxDistance 26
            Priority    3
        [/Effect]

        [Effect]
            Name        TempleFloorRune
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbFloorRune
            Flicker     0.15
            Spacing     4
            MaxDistance 22
            Priority    3
            Reduced     yes
        [/Effect]

        # In operation: golden specks around a praying creature
        [Effect]
            Name        TemplePrayerMotes
            Target      Tile
            Match       templeRoom
            When        Occupied
            Kind        Particle
            System      RoomAmbPrayMotes
            Offset      0 0 0.1
            Spacing     2
            MaxDistance 20
            Priority    6
        [/Effect]

        ##### Prison #####

        # Idle: dripping water, flies in the corners, a glint in the skulls, creaking bars
        [Effect]
            Name        PrisonDrip
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbDrip
            Spacing     5
            MaxDistance 18
            Priority    2
        [/Effect]

        [Effect]
            Name        PrisonFlies
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbFlies
            Spacing     4
            NeedWall    yes
            MaxDistance 16
            Priority    1
        [/Effect]

        [Effect]
            Name        PrisonSkullGlint
            Target      Object
            Match       Skull
            When        Always
            Kind        Particle
            System      RoomAmbSkullGlint
            Offset      0 0.2 0.3
            Flicker     0.5
            MaxDistance 18
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        PrisonBarsCreak
            Target      Object
            Match       FenceCorner
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        0 1 0
            Amount      0.3
            Speed       0.4
            MaxDistance 18
            Priority    1
        [/Effect]

        # In operation: the bars rattle when a prisoner pulls on them
        [Effect]
            Name        PrisonBarsRattle
            Target      Object
            Match       FenceStraight FenceCorner
            When        Occupied
            Kind        Motion
            Motion      Sway
            Axis        0 1 0
            Amount      1.0
            Speed       7
            MaxDistance 20
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        PrisonBarsDust
            Target      Object
            Match       FenceStraight
            When        Occupied
            Kind        Particle
            System      RoomAmbHitDust
            Offset      0 0 0.2
            MaxDistance 14
            Priority    3
        [/Effect]

        ##### Torture room #####

        # Idle: glowing coals, creaking frames, cold glints on chains
        # (the chimneys with fire, smoke and embers are in roomAmbienceProduction.cfg)
        [Effect]
            Name        TortureCoals
            Target      Object
            Match       TortureObject
            When        Always
            Kind        Particle
            System      RoomAmbEmberGlow
            Offset      0 0 0.3
            Flicker     0.3
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TortureCreak
            Target      Object
            Match       TortureObject
            When        Always
            Kind        Motion
            Motion      Wobble
            Axis        0 1 0
            Amount      0.8
            Speed       0.7
            MaxDistance 22
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TortureChains
            Target      Tile
            Match       tortureRoom
            When        Always
            Kind        Particle
            System      RoomAmbIronGlint
            Spacing     3
            MaxDistance 16
            Priority    1
        [/Effect]

        # In operation: the frame turns slowly, steam and sparks from the hot irons
        [Effect]
            Name        TortureFrameTurns
            Target      Object
            Match       TortureObject
            When        Occupied
            Kind        Motion
            Motion      Sway
            Axis        0 0 1
            Amount      3
            Speed       0.25
            MaxDistance 22
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TortureSteam
            Target      Object
            Match       TortureObject
            When        Occupied
            Kind        Particle
            System      RoomAmbSteam
            Offset      -0.3 0 0.3
            MaxDistance 18
            Priority    4
        [/Effect]

        [Effect]
            Name        TortureSparks
            Target      Object
            Match       TortureObject
            When        Occupied
            Kind        Particle
            System      RoomAmbAnvilSparks
            Offset      0.3 0 0.35
            MaxDistance 18
            Priority    4
        [/Effect]

        ##### Crypt #####

        # Idle: mist over the floor, grave lights, bones that rattle a little
        [Effect]
            Name        CryptMist
            Target      Tile
            Match       cryptRoom
            When        Always
            Kind        Particle
            System      RoomAmbMist
            Spacing     2
            MaxDistance 22
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CryptGraveLight
            Target      Object
            Match       CelticCross
            When        Always
            Kind        Particle
            System      RoomAmbGraveLight
            Offset      0 0 1.1
            Flicker     0.3
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        CryptStatueGlimmer
            Target      Object
            Match       KnightStatue KnightStatue2
            When        Always
            Kind        Particle
            System      RoomAmbGraveLight
            Offset      0 0 1.2
            Flicker     0.4
            MaxDistance 18
            Priority    2
        [/Effect]

        [Effect]
            Name        CryptBonesRattle
            Target      Object
            Match       KnightCoffin StoneCoffin
            When        Always
            Kind        Motion
            Motion      Wobble
            Axis        1 0 0
            Amount      0.6
            Speed       1.3
            MaxDistance 20
            Priority    2
            Reduced     yes
        [/Effect]

        # In operation: a pale light rises from the graves when a creature is close
        [Effect]
            Name        CryptWisp
            Target      Object
            Match       KnightCoffin StoneCoffin CelticCross
            When        Occupied
            Kind        Particle
            System      RoomAmbWisp
            Offset      0 0 0.85
            MaxDistance 20
            Priority    5
        [/Effect]

        ##### Arena #####

        # Idle: shields that sway on the wall, glints, a little sand in the air
        [Effect]
            Name        ArenaShieldsSway
            Target      Object
            Match       WeaponShield1 WeaponShield2
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        1 0 0
            Amount      1.2
            Speed       0.4
            MaxDistance 22
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        ArenaShieldGlint
            Target      Object
            Match       WeaponShield1 WeaponShield2
            When        Always
            Kind        Particle
            System      RoomAmbIronGlint
            Offset      0 0 0.5
            MaxDistance 16
            Priority    1
        [/Effect]

        [Effect]
            Name        ArenaSand
            Target      Tile
            Match       arenaRoom
            When        Always
            Kind        Particle
            System      RoomAmbArenaDust
            Spacing     4
            MaxDistance 18
            Priority    1
        [/Effect]

        # In operation: fighters kick up dust, the shields rattle
        [Effect]
            Name        ArenaFightDust
            Target      Tile
            Match       arenaRoom
            When        Occupied
            Kind        Particle
            System      RoomAmbHitDust
            Offset      0 0 0.1
            Spacing     2
            MaxDistance 22
            Priority    5
        [/Effect]

        [Effect]
            Name        ArenaShieldsRattle
            Target      Object
            Match       WeaponShield1 WeaponShield2
            When        Occupied
            Kind        Motion
            Motion      Wobble
            Axis        1 0 0
            Amount      4
            Speed       3.5
            MaxDistance 22
            Priority    4
            Reduced     yes
        [/Effect]

        ##### Decorations: banners in the arena, soil that heaves in the crypt #####
        [Effect]
            Name        ArenaBanners
            Target      Tile
            Match       arenaRoom
            When        Always
            Kind        Model
            Mesh        ArenaBanner.mesh
            WallSide    yes
            Spacing     4
            Offset      0 0 1.7
            Motion      Sway
            Axis        0 1 0
            Amount      3
            Speed       0.3
            MaxDistance 18
            Priority    1
        [/Effect]

        [Effect]
            Name        CryptGraveMound
            Target      Tile
            Match       cryptRoom
            When        Always
            Kind        Model
            Mesh        GraveMound.mesh
            Spacing     6
            Motion      Pulse
            Amount      0.08
            Speed       0.2
            MaxDistance 14
            Priority    1
        [/Effect]

        # Revival: a pale light rises where a creature appears in the crypt
        [Effect]
            Name        CryptRevivalLight
            Target      Event
            Event       CreatureArrived
            Match       cryptRoom
            Kind        Particle
            System      RoomAmbWisp
            Offset      0 0 0.6
            Duration    3.0
            MaxDistance 30
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
