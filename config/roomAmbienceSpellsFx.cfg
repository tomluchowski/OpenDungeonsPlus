# More cosmetic effects of the spells, client side only (see roomAmbienceSpells.cfg for the idea): bolts and
# flying charges (Kind Beam and Projectile), the own healing, haste, defense and slow looks, the ends of the
# defector and hen spells and of a possession that ended because the creature fell, and the impact sounds of
# the spells. The server reports every one of them with the family "SpellFx/<Name>" of an existing sound message;
# the client starts the event "SpellFx<Name>" at that tile. The cast sounds come with the server message (own
# family per spell), the impact sounds are played from here.
# Beam: Mesh is stretched from From (relative to the target) to the target, Amount = width, Speed = flickers
# per second. Projectile: Mesh and/or System (trail) fly from From to the target on an arc of height Amount;
# Land = event raised when it arrives.

[RoomAmbience]
    [Effects]

        ##### Bolts and flying charges #####

        [Effect]
            Name        SpellBoltBeam
            Target      Event
            Event       SpellFxLightning
            Kind        Beam
            Mesh        SpellBolt
