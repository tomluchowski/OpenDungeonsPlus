# Room ambience: cosmetic life in the rooms (dust, glow, sparks, moving objects). Client side only,
# nothing here changes the game, a save game or the network.
#
# The effects only run for rooms and objects that are in view and close to the camera, and only as
# many as the limits below allow. The game option "Room ambience" (full / reduced / off) reduces or
# stops them; in "reduced" only effects marked "Reduced yes" run, at a shorter distance.
# A name that does not exist in this build (a room, a mesh, a particle system) is skipped quietly.
# The console command "roomambience" lists the events and starts one at a tile.
#
# Format: [RoomAmbience] with [Settings], [Effects] and "Include <file>" lines (files in this folder,
# a missing file is skipped). Each [Effect] has:
#   Name        name of the effect (for the log)
#   Target      Object (a rendered object, found by its mesh name; * at the start or end is a wildcard),
#               Tile (a room tile, found by its tile visual name, e.g. libraryRoom) or
#               Event (one-shot at the place where something happened)
#   Match       one or more names. Events: the tile visual names the event is about (none = any)
#   When        Always, Occupied (a creature is close to the target) or Empty (no creature for the time
#               in After; unused rooms); objects only: Hit (a door was just hit), Locked (a door that its
#               keeper has locked), Reloading (a trap reloads or is empty), Ready (a trap is loaded) - not
#               for events
#   Event       event name (target Event): RoomBuilt, RoomSold, ResearchDone, ItemCrafted, GoldDeposited,
#               ChickenArrived, TrapBuilt, TrapSold, DoorOpen, DoorClose, SpellFx<Name> (a spell effect the server
#               reported, see roomAmbienceSpellsFx.cfg), SpellFxHandCast (more are added by the room groups)
#   Kind        Particle (System = particle system name) or Motion (Motion = Sway, Wobble, Spin, Bob, Pulse
#               or Flicker; Axis x y z, Amount, Speed; moves the object node and puts it back afterwards) or
#               Shake (events only: a short shake of the view; Amount = strength in world units at the middle
#               of the view, Speed = shakes per second, Duration, MaxDistance = distance of the event from the
#               middle of the view beyond which it is not felt),
#               Sound (Family = folder below sounds/Spatial, e.g. Traps/Gas/Idle; at an event it is played
#               when the event happens, Delay = seconds later; at an object it is played now and then,
#               Every = average seconds between two sounds),
#               Mark (events only: a particle system that stays on the floor for Duration seconds; the oldest
#               mark is removed when there are more than MaxMarks),
#               Beam (events: Mesh is stretched from From, relative to the target, to the target for Duration seconds
#               and flickers; Amount = width, Speed = flickers per second) or Projectile (events: Mesh and/or System
#               as trail fly from From to the target in Duration seconds on an arc of height Amount; Land = event
#               raised there when it arrives; MaxFlights in [Settings] limits Beam and Projectile together) or
#               Turn (objects only: slowly turns the object toward creatures within Amount tiles, enemies first,
#               and back to where it stood when none is near; Speed = degrees per second) or
#               Model (tiles only: Mesh = a small decoration mesh file placed on the tile and turned away from the
#               wall (see WallSide); Motion, Axis, Amount and Speed move it around its pose, Amount 0 = it stands still)
#   Offset      x y z added to the position of the target
#   After       seconds without a creature before an Empty effect starts
#   Amount      degrees (Sway, Wobble), units (Bob), fraction (Pulse, Flicker)
#   Speed       cycles per second (degrees per second for Spin)
#   Flicker     particle size change, 0 = steady (glow that flickers like a flame)
#   Duration    seconds a one-shot effect is kept
#   Chance      chance that a one-shot effect is shown
#   Spacing     tiles and events: only every n-th tile gets the effect
#   NeedWall    tiles: only tiles beside a wall
#   WallSide    tiles: the effect is moved to the edge of the tile that touches a wall (also only tiles beside a wall)
#   HeartRate   yes = Speed (flicker or motion) is the beat of a calm dungeon heart; the heart near the effect makes it
#               faster the more it is hurt (only the health of the own heart is known to the client)
#   MaxDistance distance to the camera up to which the effect runs
#   Priority    higher priority effects are served first when the limits are used up
#   Reduced     yes = also shown in the mode "reduced"
#   OwnerOnly   yes = only shown or heard by the keeper the object or the thing of the event belongs to (a secret
#               door must not be given away)

[RoomAmbience]
    [Settings]
        ScanInterval            0.4
        MaxParticles            48
        MaxParticlesReduced     10
        MaxMotions              40
        MaxOneShots             16
        MaxMarks                6
        MaxFlights              6
        OccupiedRadius          2.2
        ReducedDistanceFactor   0.55
    [/Settings]

    [Effects]
        # Specks floating in a room that nobody uses
        [Effect]
            Name        DustEmpty
            Target      Tile
            Match       dormitoryRoom treasuryRoom workshopRoom trainingHallRoom libraryRoom hatcheryRoom cryptRoom prisonRoom arenaRoom casinoRoom tortureRoom guardRoom templeRoom
            When        Empty
            After       25
            Kind        Particle
            System      RoomAmbDust
            Spacing     3
            MaxDistance 26
            Priority    2
        [/Effect]

        # Cobwebs in the corners of a room that is rarely used
        [Effect]
            Name        CobwebNeglected
            Target      Tile
            Match       dormitoryRoom treasuryRoom workshopRoom trainingHallRoom libraryRoom hatcheryRoom cryptRoom prisonRoom arenaRoom casinoRoom tortureRoom guardRoom templeRoom
            When        Empty
            After       150
            Kind        Particle
            System      RoomAmbWeb
            Spacing     5
            NeedWall    yes
            MaxDistance 22
            Priority    3
            Reduced     yes
        [/Effect]

        # A room that was just built: dust where parts are put in place
        [Effect]
            Name        BuiltDust
            Target      Event
            Event       RoomBuilt
            Kind        Particle
            System      RoomAmbBuildPuff
            Duration    2.5
            Spacing     2
            Chance      0.8
            MaxDistance 40
            Reduced     yes
        [/Effect]

        # A room that was sold: it crumbles to dust
        [Effect]
            Name        SoldCrumble
            Target      Event
            Event       RoomSold
            Kind        Particle
            System      RoomAmbCrumble
            Duration    3.0
            Spacing     2
            MaxDistance 40
            Reduced     yes
        [/Effect]

        [Effect]
            Name        SoldDebris
            Target      Event
            Event       RoomSold
            Kind        Particle
            System      RoomAmbDebris
            Duration    2.0
            Spacing     2
            MaxDistance 40
        [/Effect]
    [/Effects]

    # The room groups, one file each
    Include roomAmbienceProduction.cfg
    Include roomAmbienceCare.cfg
    Include roomAmbienceCoreObjects.cfg
    Include roomAmbienceOther.cfg
    Include roomAmbienceTraps.cfg
    Include roomAmbienceSpells.cfg
    Include roomAmbienceSpellsFx.cfg
    Include roomAmbienceFixEffects.cfg
[/RoomAmbience]
