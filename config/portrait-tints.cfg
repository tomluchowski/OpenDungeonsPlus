# Colour variation of the illustrated creature portraits ("Dungeonbook").
#
# Every creature gets its own slightly different portrait: a few colour regions of the
# painted portrait (hair, beard, eyes, skin, teeth) are recoloured from the creature name,
# so the result is the same on every machine and in every game. No new artwork is needed.
#
# Format: line based, columns separated by TAB, '#' starts a comment.
#   [Palette]
#   Name<TAB>name
#   Colour<TAB>name<TAB>hue 0-360<TAB>saturation 0-1<TAB>brightness 0-1
#   [Portrait]
#   Mesh<TAB>image name, i.e. the file portrait-<name>.png: Orc.mesh, or Orc.mesh-female for a gender image
#   Region<TAB>name<TAB>palette=<name> or shift=hue,sat,val<TAB>box=x0,y0,x1,y1<TAB>hue=a,b<TAB>sat=a,b<TAB>val=a,b[<TAB>not=x0,y0,x1,y1,...]
#
