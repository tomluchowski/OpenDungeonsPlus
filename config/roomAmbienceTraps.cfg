# Room ambience of the traps: looks that are shown all the time or while a creature is close, and the
# effects of the server messages "a trap went off" (TrapFired) and "a trigger trap set this trap off"
# (TrapLinked). Format and keys: see config/roomAmbience.cfg. "trap:<type>" in Match of an object effect
# is the type of the trap (Alarm, Fear, Gas, Lightning, Fireburst, Freeze, WatchBanner, Trigger); in an
# event effect Match is the type name the server sent. Purely cosmetic.

[RoomAmbience]
    [Effects]
        ##### Alarm: a flashing light and rings when the trap goes off #####

        [Effect]
            Name        AlarmFlash
            Target      Event
            Match       Alarm
            Event       TrapFired
            Kind        Particle
            System      RoomAmbAlarmFlash
            Offset      0 0 0
            Duration    2.0
            MaxDistance 16
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        AlarmRings
            Target      Event
            Match       Alarm
            Event       TrapFired
            Kind        Particle
            System      RoomAmbAlarmRing
            Offset      0 0 0
            Duration    2.0
            MaxDistance 16
            Priority    3
        [/Effect]

        ##### Fear: dark mist around the trap, a ghostly shape bursts out when it goes off #####

        [Effect]
            Name        FearMist
            Target      Object
