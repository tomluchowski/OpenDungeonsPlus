        ##### Cannon: the barrel slowly follows creatures nearby, Boulder: dust behind the rolling boulder and a shaking view #####
        # The cannon turns from whatever direction it has now, so the aim the server gives it for a shot is kept
        # (the turn is paused for a moment after TrapFired). The boulder itself is the missile of the server; the
        # client adds a dust trail behind it, a burst in the niche and a shake of the view.

        [Effect]
            Name        CannonTurn
            Target      Object
            Match       trap:Cannon
            When        Always
            Kind        Turn
            Amount      9
            Speed       25
            MaxDistance 16
            Priority    2
            Reduced     yes
        [/Effect]

        # The server launches the real boulder (a missile that rolls and hurts); the client only adds dust behind it
        # and a burst of fragments in the niche. A second, client-made boulder would roll the wrong way. Only a
        # missile with the mesh Boulder that is moving counts (RoomAmbience::scanObjects gives it the kind BoulderMoving),
        # cannonballs and the other missiles get no dust.
        [Effect]
            Name        BoulderMissileDust
            Target      Object
            Match       trap:BoulderMoving
            When        Always
            Kind        Particle
            System      RoomAmbBoulderTrail
            Offset      0 0 0.05
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        BoulderLaunchBurst
            Target      Event
            Match       Boulder
            Event       TrapFired
            Kind        Particle
            System      RoomAmbBoulderBreak
            Offset      0 0 0.35
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        BoulderRollShake
            Target      Event
            Match       Boulder
            Event       TrapFired
            Kind        Shake
            Amount      0.1
            Speed       11
            Duration    1.1
            MaxDistance 24
            Priority    5
        [/Effect]

