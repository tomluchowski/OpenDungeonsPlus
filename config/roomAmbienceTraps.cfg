# Room ambience of the traps and doors: looks that are shown while a trap is loaded, while it reloads or is
# empty, all the time or while a creature is close, and the effects of the server messages "a trap went off"
# (TrapFired), "a trigger trap set this trap off" (TrapLinked), "a door was hit" (DoorHit, DoorHurt when its
# health is at half or less) and "a door was destroyed" (DoorWrecked). The client itself finds the events
# TrapBuilt and TrapSold. Format and keys: see config/roomAmbience.cfg. "trap:<type>" in Match of an object
# effect is the type of the trap or door (Alarm, Fear, Gas, Lightning, Fireburst, Freeze, WatchBanner, Trigger,
# DoorWooden, DoorIronbound, DoorSteel, DoorBarricade, DoorSecret, DoorRuned); in an event effect Match is the
# type name the server sent. "When Ready" and "When Reloading" follow the reload state the server sends, "When Hit"
# a door that was hit a moment ago, "When Locked" a closed door. The cannon turns toward creatures nearby and the
# boulder trap shakes the view. A secret door shows its glow and dust only to its keeper (OwnerOnly). Purely
# cosmetic.

[RoomAmbience]
    [Effects]

        ##### Alarm: a light that pulses while the trap is loaded and dims while it reloads, a flash and rings when it goes off #####

        [Effect]
            Name        AlarmLight
            Target      Object
