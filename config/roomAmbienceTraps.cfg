# Room ambience of the traps: looks that are shown while a trap is loaded, while it reloads or is empty,
# all the time or while a creature is close, and the effects of the server messages "a trap went off"
# (TrapFired) and "a trigger trap set this trap off" (TrapLinked). Format and keys: see config/roomAmbience.cfg.
# "trap:<type>" in Match of an object effect is the type of the trap (Alarm, Fear, Gas, Lightning, Fireburst,
# Freeze, WatchBanner, Trigger); in an event effect Match is the type name the server sent. "When Ready" and
# "When Reloading" follow the reload state that the server sends. Purely cosmetic.

[RoomAmbience]
    [Effects]

        ##### Alarm: a light that pulses while the trap is loaded and dims while it reloads, a flash and rings when it goes off #####

        [Effect]
            Name        AlarmLight
            Target      Object
            Match       trap:Alarm
            When        Ready
            Kind        Particle
            System      RoomAmbAlarmLight
            Offset      0 0 0
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        AlarmFlash
            Target      Event
            Match       Alarm
            Event       TrapFired
            Kind        Particle
            System      RoomAmbAlarmFlash
            Offset      0 0 0
            Duration    2.0
            MaxDistance 16
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        AlarmRings
            Target      Event
            Match       Alarm
            Event       TrapFired
            Kind        Particle
            System      RoomAmbAlarmRing
            Offset      0 0 0
            Duration    2.0
            MaxDistance 16
            Priority    3
        [/Effect]

