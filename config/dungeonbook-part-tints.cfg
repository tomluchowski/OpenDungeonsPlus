# Hair and beard colours of the Dungeonbook pictures.
#
# The neutral bases have no hair, eyes or beards, so these come from the chosen parts. Each creature gets its
# own colour from its name (the same on every machine), applied to the part before the parts are composed.
# Same format and same code (PortraitTint) as dungeonbook-base-tints.cfg, with these differences:
#   - Mesh is a part key, not a catalog id: the slot name ("hair") for every option of the slot, or the slot
#     name, a colon and the option name as written in the manifests ("chin:forked") for one option.
#     Both keys are applied to a part if both exist.
#   - box, hue, sat and val select within the part image; only visible pixels (alpha above 0) take part.
#   - The colour of a region is chosen from the creature name and the REGION NAME, so every region called
#     Hair gives a creature the same hair colour: hair and beard match.
#
# Eyes: the eyes parts show brows, lids and skin around the eyes, and the iris lies at another place in
# every base, so each block is keyed by catalog id, slot and option ("Orc.mesh:eyes:round") and its regions
# are ellipses on the iris (ellipse=cx,cy,rx,ry: centre as fractions of width and height, both radii as
# fractions of the width) limited to the iris colours (hue, sat, val). All eyes of a creature get one colour
# (region name Eyes). The ellipses were measured from the artwork; options that could not be separated
# cleanly from lids and skin have no block and keep their drawn eye colour (listed in the state notes).
#
# Palettes fire, glow and hair_brown are the ones of portrait-tints.cfg (same colours in the same order), used where
# the old portrait of that base uses them: Orc and Troll eyes fire, Kobold eyes glow (with the colour limits of the old
# regions), Monk (female) hair hair_brown. A catalog specific block replaces the generic one for that part. The region
# names (Eyes, Hair) are the old ones, so a creature gets the same palette colour as in the old portrait.
#
# Parts without an entry keep their drawn colours. That is intended for skin like parts (the chin shapes
# "square" and "rounded", ears, nose, mouth) and for the non human hair (frills, moss).
# Base skin: the bases are bare, and their regions (config/dungeonbook-base-tints.cfg, delivered with the
# artwork) may have a skin amplitude of 0, which means no variation. The entry base-skin gives every skin
# region with amplitude 0 this amplitude (hue degrees, saturation and value as fractions), so the skin colour
# of a creature varies as in the old portraits, from the same source (the creature name and the region name
# Skin). 6,0.12,0.12 is the most common skin amplitude in portrait-tints.cfg. Only the amplitude is used,
# the area and colour limits stay those of the base region.
