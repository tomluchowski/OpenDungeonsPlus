# Name groups for the creature social profiles ("Dungeonbook").
#
# Format: line based, columns separated by TAB, '#' starts a comment.
# Each [NameGroup] block lists the creature classes it serves (Classes), an age
# range, a gender weight triple and the name pools. Values may contain spaces.
#   Group          name of the group
#   Classes        creature class names (Name in creatures.cfg) served by the group
#   AgeRange       min and max age
#   GenderWeights  relative weights for F (female), M (male), X (unspecified)
#   AgeJoke        optional, shown instead of the number for a part of the creatures
#   Given          gender (F, M or X), then the given names
#   Surname        surnames
#   Title          epithets, each one a phrase that follows the name ("the Damp")
#   Hometown       fictional places
# A class that is not listed in any group falls back to the group "monster".
#
# The profile of a creature is generated from its name (for example Orc17) only.
# Order matters: the n-th pick of a pool depends on the pool size and order.
# Appending entries keeps most existing profiles, inserting or removing reshuffles them.
# All names are invented for this game.

