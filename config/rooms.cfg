# Room configuration file.
# Rooms configurable elements are defined within [Rooms] [/Rooms]
# There is no need to use child tags for each room (to make reading easier). However, to make things more
# understandable, elements name should begin by the room name and be gathered per room type.
#
# Supported elements:
# HatcheryCostPerTile               (int)    Cost per tile for hatchery room
# HatcheryHungerPerChicken          (double) How much hunger decreases when a creature eats a chicken
# HatcheryHpRecoveredPerChicken     (double) How much HP is recovered when a creature eats a chicken
# HatcheryCareLightPercent         (uint)   Percent by which the laying times are shorter while the hatchery is claimed and lit. The two care bonuses add up (max. 90 together)
# HatcheryCareCalmPercent          (uint)   Percent by which the laying times are shorter while the hatchery is claimed and no enemy stands in it
# HatcheryCareLightRadius          (double) Tiles around a hatchery tile within which a map light counts as lighting it
# HatcheryTramplePercent           (uint)   Chance (percent per turn) that an enemy creature or hero next to an egg tramples it (creatures of the keeper never do)
# HatcheryTrampleRadius            (double) Distance in tiles within which an enemy tramples an egg
# HatcheryNestEggs                (uint)   1 = hens lay their eggs in free straw nests scattered over the hatchery (the nest closest to the hen first), 0 = always at the hen. With all nests full the egg lies at the hen
# HatcheryNestSameRadius          (double) Distance in tiles within which an egg counts as lying in a nest place (a place can hold one egg)
# The straw nests lie scattered over the hatchery. Their places are computed from the tiles of the hatchery and of its coops alone (only the server computes them, it sends them to the clients), on tiles of the hatchery only
# HatcheryNestTilesPerNest        (uint)   About one floor nest per this many tiles of the hatchery (subject to HatcheryNestMax)
# HatcheryNestMax                 (uint)   Most floor nests, also when the number of coops is larger
# HatcheryNestEdge                (double) Distance in tiles from the middle of a nest to every tile that is not part of the hatchery (wall, other room)
# HatcheryNestCoopClearance       (double) Distance in tiles from the middle of a nest to the footprint of a coop
# HatcheryNestLaneLength          (double) The apron in front of the ramp of a coop is kept free of nests: its length in tiles
# HatcheryNestLaneHalfWidth       (double) Half of the width in tiles of that apron
# HatcheryNestLaneClearance       (double) Distance in tiles from the middle of a nest to that apron
# HatcheryNestPathHalfWidth       (double) Half of the width in tiles of the walking strip from each entrance tile of the hatchery to the apron of each coop (no nests lie on it)
# HatcheryNestPathClearance       (double) Distance in tiles from the middle of a nest to that walking strip
# HatcheryNestSpacing             (double) Smallest distance in tiles between the middles of two nests
# A few loose feathers lie scattered over an empty hatchery (the server computes their places together with the nests and sends them to the clients). They keep the edge, coop, apron and walking strip distances of the nests
# HatcheryFeatherTilesPerPlace    (uint)   About one place of loose feathers per this many tiles of the hatchery
# HatcheryFeatherMin              (uint)   Fewest places of loose feathers (a small hatchery can have fewer when the rules leave no room)
# HatcheryFeatherMax              (uint)   Most places of loose feathers
# HatcheryFeatherNestClearance    (double) Distance in tiles from the middle of a place of feathers to the middle of every nest
# HatcheryFeatherSpacing          (double) Smallest distance in tiles between two places of feathers
# The walk of a laying hen to her nest (no setting): the real walk is the distance divided by her walking speed; she sets off when the turns left until her egg are as many as the walk plus HatcheryLayShowTurns, so the egg appears when her laying timer runs out and the rate of eggs does not depend on the way. A nest the walk to which does not fit into the time left is not used (the egg lies where she sits down)
# HatcheryNestArrive              (double) Distance in tiles to the place next to the nest at which the hen counts as arrived and sits down to lay
# HatcheryChickenSpawnRate          (uint)   How many turns an empty hatchery (no hen, chick or egg) waits until a hen comes out of a coop. A hatchery without a rooster waits just as long until a new rooster comes out of a coop (the rooster does not count towards the hens)
# HatcheryCoopBatch                (uint)   Hens that come out of the coops together when the wait of an empty hatchery is over (0 = one hen per coop)
# HatcheryYoungLostTurns           (uint)   Turns an egg or chick dropped outside a hatchery lasts before it is lost
# HatcheryScatterRadius            (double) Tiles within which a hen runs off from a hungry creature
# HatcheryScatterTurns             (uint)   Turns a hen that scattered does not scatter again
# HatcheryScatterAttempts          (uint)   How many places a scared hen tries when she runs off
# HatcheryScatterMargin            (double) Tiles beyond HatcheryScatterRadius that the place a scared hen runs to keeps from the creature
# HatcheryFlutterPercent           (uint)   Chance (percent per turn) that an idle hen flutters up for a moment
# HatcheryScratchPercent           (uint)   Chance (percent per turn) that an idle hen scratches the ground
# HatcheryLayMin                   (uint)   Fewest turns between two eggs of one hen
# HatcheryLayMax                   (uint)   Most turns between two eggs of one hen
# HatcheryLayFactor                (double) Factor on the laying times (the timer balance): 1.021 makes the edible chickens per minute equal to those before the life cycle within 3 percent (unit test BalanceParity, python port in the notes of the test). The care bonus and the research multiply it
# HatcheryLayShowTurns             (uint) Turns a laying hen shows herself sitting (Lay pose) before the egg appears in the nest (0 = the egg appears at once). Eggs not yet shown count towards the capacity and are saved
# HatcheryHatchTurns               (uint)   How many turns an egg needs to hatch (only while the hatchery has a rooster)
# HatcheryGrowTurns                (uint)   How many turns a chick needs to grow into a hen
# HatcheryFightTurns               (uint)   Turns two roosters of one hatchery brawl once they stand face to face; then the one drawn by the server wins and the other one dies
# HatcheryFightApproachTurns       (uint)   Turns two roosters get at most to walk up to each other; after that they brawl where they stand
# HatcheryFightReach               (double) Distance in tiles at which two fighting roosters start to brawl
# HatcheryFightFeatherSeconds      (double) Seconds between two clouds of feathers while two roosters brawl (client side, look only)
# HatcheryTilesPerChicken          (uint)   Hatchery tiles needed for one hen, chick or egg (the number of coops limits it too)
# HatcheryWanderPausePercent       (uint)   Chance (percent per turn) that a roaming hen, chick or rooster pecks for a moment instead of walking on
# HatcheryWanderReach              (double) Longest way in tiles of one walk to a free point (0 = any point of the room); the animals roam the whole room, one walk after the other
# HatcheryWanderMinLeg             (double) Shortest way in tiles of one walk
# HatcheryWanderBend               (double) Sideways bend of a walk as a part of its length (0 = straight line); the way is a soft curve with one bend
# HatcheryWanderEdge               (double) Distance in tiles the free points keep to every tile that is not part of the hatchery (walls, other rooms)
# HatcheryWanderNestClearance      (double) Distance in tiles the free points keep to the middle of a nest (the coops are kept free by their footprint)
# HatcheryWanderAttempts           (uint)   How many free points are tried for one walk before the animal stays
# HatcheryRoosterCrowMin           (uint)   Fewest turns between two crows of the rooster; for every crow he jumps on a coop roof, crows from there and jumps down again (no fixed time of day)
# HatcheryRoosterCrowMax           (uint)   Most turns between two crows of the rooster
# HatcheryRoosterChasePercent      (uint)   Chance (percent per turn) that the strutting rooster chases a hen
# HatcheryRoosterLeadPercent       (uint)   Chance (percent per turn) that the strutting rooster leads the chicks
# HatcheryRoosterChaseTurns        (uint)   Turns the rooster runs after a hen at most
# HatcheryRoosterGuardTurns        (uint)   Turns the rooster defends the flock against a creature
# HatcheryRoosterLeadTurns         (uint)   Turns the rooster leads the chicks
# HatcheryRoosterCallPercent       (uint)   Chance (percent per turn) that the strutting rooster scratches up food and calls the hens to him
# HatcheryRoosterCallTurns         (uint)   Turns the rooster calls the hens
# HatcheryRoosterGuardRadius       (double) Tiles around the rooster in which a creature after the chickens (or an enemy) makes him defend the flock
# HatcheryCoopRoofHeight           (double) Height above the floor of the coop roof where the rooster sits
# HatcheryCoopPerchOffset          (double) Distance from the coop tile center along the tile to the middle of the roof
# HatcheryChickGap                 (double) Distance in tiles a chick keeps to the animal in front of it
# HatcheryChickScale               (double) Size of the chick compared to a hen (look only)
# HatcheryRoosterScale             (double) Size of the rooster compared to a hen (look only)
# HatcheryRoosterCrowTurns         (uint) Turns a crow of the rooster lasts
# HatcheryRoosterGuardFar          (double) Guarding: farther than this (tiles) the rooster runs up to the creature
# HatcheryRoosterGuardNear         (double) Guarding: closer than this (tiles) the rooster runs off, between near and far he puffs up and pecks
# HatcheryRoosterGuardApproachGap  (double) Guarding: distance (tiles) at which the rooster stops when he runs up to the creature
# HatcheryRoosterCatchDistance     (double) Distance (tiles) at which the chasing rooster has caught the hen
# HatcheryRoosterWalkGap           (double) Distance (tiles) at which the rooster stops from a hen or a coop roof place he walks to
# HatcheryRoosterHopDistance       (double) Distance (tiles) from the roof place within which the rooster hops up at once
# HatcheryRoosterLeadScratchChance (uint) One in N: a leading rooster scratches the ground in this turn
# HatcheryRoosterCallScratchChance (uint) One in N: a calling rooster scratches the ground in this turn
# HatcheryFightStandFactor         (double) Fraction of HatcheryFightReach at which a rooster stops in front of the other one
# HatcheryChickTintR, G, B         (double) Colour factors of the chick (look only)
# HatcheryRoosterTintR, G, B       (double) Colour factors of the rooster (look only)
# HatcheryCooldownChickenMin        (uint)   How many turns a creature will stay idle after eating a chicken minimum
# HatcheryCooldownChickenMax        (uint)   How many turns a creature will stay idle after eating a chicken maximum
# HatcheryReturnPathTiles         (uint)   Tiles a hen or rooster outside a hatchery walks per leg on its way back to a hatchery of its keeper
# HatcheryReturnSearchTiles       (uint)   Most tiles looked at when searching the way back to a hatchery (a longer way counts as no way)
# HatcheryReturnRetryTurns        (uint)   Turns a hen waits before it searches the way back again after it found none (it dies after 30 turns outside without one)
# HatcheryReturnMaxTurns          (uint)   Turns a hen may be on its way back to a hatchery; after that the 30 turn rule applies again (0 = never gives up)
# TrainHallCostPerTile              (int)    Cost per tile for training hall room
# TrainHallXpPerAttack              (double) How many experience a creature gets for each blow
# TrainHallWakefulnessPerAttack     (double) How many wakefulness a creature looses for each blow
# TrainHallCooldownHitMin           (uint)   How many turns a creature will stay idle after hitting a dummy minimum
# TrainHallCooldownHitMax           (uint)   How many turns a creature will stay idle after hitting a dummy maximum
# TrainHallBonusWallActiveSpot      (double) Bonus percent points that a creature while training for each wall active spot
# TrainHallMaxTrainingLevel         (uint)   Defines the maximum level a creature can reach by training in the training room
# CryptCostPerTile                  (int)    Cost per tile for crypt room
# CryptRotNbTurns                   (uint)   How many turns a creature will rot before its max hp are added to the crypt
# CryptBonusWallActiveSpot          (double) Bonus percent points that a crypt will get per rotten creature for each wall active spot
# CryptPointsForSpawn               (uint)   How many points are needed for the crypt creature to spawn
# CryptSpawnClass                   (string) Class of the creature that will spawn when the given points are gathered
# WorkshopCostPerTile               (int)    Cost per tile for Workshop room
# WorkshopPointsPerWork             (double) How many points the Workshop gets for each work turn (per creature efficiency point)
# WorkshopWakefulnessPerWork        (double) How many wakefulness a creature looses for each work turn
# WorkshopCooldownWorkMin           (uint)   How many turns a creature will stay idle after working minimum
# WorkshopCooldownWorkMax           (uint)   How many turns a creature will stay idle after working maximum
# TreasuryCostPerTile               (int)    Cost per tile for treasury room
# DormitoryCostPerTile              (int)    Cost per tile for dormitory room
# LibraryCostPerTile                (int)    Cost per tile for library room
# LibraryPointsPerWork              (double) How many points the library gets for each work turn (per creature efficiency point)
# LibraryWakefulnessPerWork         (double) How many wakefulness a creature looses for each work turn
# LibraryCooldownWorkMin            (uint)   How many turns a creature will stay idle after working minimum
# LibraryCooldownWorkMax            (uint)   How many turns a creature will stay idle after working maximum
# LibrarySkillPointsBook            (uint)   How many points have to be researched to create a book
# PortalCooldownSpawnMin            (uint)   How many minimum turns a portal will be inactive after spawning a creature
# PortalCooldownSpawnMax            (uint)   How many maximum turns a portal will be inactive after spawning a creature
# PrisonCostPerTile                 (int)    Cost per tile for prison room
# PrisonDamagePerTurn               (double) Damages per turn done by the prison room (ignores physical and magical defense)
# WoodenBridgeCostPerTile           (int)    Cost per tile for wooden bridge room
# StoneBridgeCostPerTile            (int)    Cost per tile for stone bridge room
# ArenaCostPerTile                  (int)    Cost per tile for arena room
# ArenaMaxTrainingLevel             (uint)   Defines the maximum level a creature can reach by training in the arena room
# CasinoCostPerTile                 (int)    Cost per tile for casino room
# CasinoWakefulnessPerWork          (double) How many wakefulness a creature looses for each work turn
# CasinoCooldownWorkMin             (uint)   How many turns a creature will stay idle after working minimum
# CasinoCooldownWorkMax             (uint)   How many turns a creature will stay idle after working maximum
# CasinoBet                         (int)    Bet per creature when playing
# CasinoFee                         (double) Percentage of money the keeper will get from the creature bets (between 0.0 and 1.0)
# TortureCostPerTile                (int)    Cost per tile for torture room
# TortureRallyPercent               (double) Percentage of chances an enemy tortured creature has to rally its torturing keeper (between 0.0 and 1.0)
#                                            It will be used once per torture session
# TortureSessionLengthMin           (uint)   How many turns a torture session lengths minimum (must be enough for torture animations) 
# TortureSessionLengthMax           (uint)   How many turns a torture session lengths maximum (must be enough for torture animations) 
# TortureDamagePerTurn              (double) Damages per turn done by the torture room (ignores physical and magical defense)

[Rooms]
    # What enemies can do to a room:
    #   0  rooms cannot be claimed, only destroyed (the historical behaviour)
    #   1  enemy workers can claim room tiles by dancing on them, one tile at a
    #      time, the way they already claim bridges and traps, and fighters
    #      can still destroy them
    #   2  only workers can take a room, tile by tile; fighters leave rooms alone
    # The dungeon temple can never be claimed, so it stays destructible in every
    # mode: destroying it is how a player is defeated.
    RoomsClaimableByEnemies	0
