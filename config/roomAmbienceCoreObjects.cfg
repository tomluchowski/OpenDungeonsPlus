# Room ambience of the dungeon heart, the portal, bridges, doors and traps.
# Format and keys: see config/roomAmbience.cfg. Offsets are for the object as it is modelled and
# turn with the object. "Reduced yes" effects are also shown in the mode "reduced".
# Bridges are tiles for the client: write "bridge:<bridge mesh>" (WoodBridge, StoneBridge) or
# "bridge:<tile visual>" (lavaGround, waterGround) in Match; motions of a bridge move its mesh.

[RoomAmbience]
    [Effects]
        ##### Dungeon heart #####

        # Idle: the glow beats, sparks rise, the heart itself swells like a heartbeat, veins in the floor glow in time
        [Effect]
            Name        HeartGlow
            Target      Object
            Match       DungeonTempleObject
            When        Always
            Kind        Particle
            System      RoomAmbHeartGlow
            Offset      0 0 1.4
            Flicker     0.18
            Speed       1.1
            MaxDistance 40
            Priority    8
            Reduced     yes
            HeartRate   yes
        [/Effect]

        [Effect]
            Name        HeartSparks
            Target      Object
            Match       DungeonTempleObject
            When        Always
            Kind        Particle
            System      RoomAmbHeartSparks
            Offset      0 0 0.6
            MaxDistance 30
            Priority    7
        [/Effect]

        [Effect]
            Name        HeartBeat
            Target      Object
            Match       DungeonTempleObject
            When        Always
            Kind        Motion
            Motion      Pulse
            Amount      0.018
            Speed       1.1
            MaxDistance 40
            Priority    8
            Reduced     yes
            HeartRate   yes
        [/Effect]

        [Effect]
            Name        HeartVeins
            Target      Tile
            Match       dungeonTempleRoom
            When        Always
            Kind        Particle
            System      RoomAmbHeartVein
            Flicker     0.2
            Speed       1.1
            MaxDistance 34
            Priority    6
            HeartRate   yes
        [/Effect]

        # In operation: sparks burst from the heart while a creature is close
        [Effect]
            Name        HeartFlare
            Target      Object
            Match       DungeonTempleObject
            When        Occupied
            Kind        Particle
            System      RoomAmbHeartFlare
            Offset      0 0 0
            MaxDistance 30
            Priority    8
        [/Effect]

        ##### Portal #####

        # Idle: the swirl turns, light on the floor, sparks fly up
        [Effect]
            Name        PortalSwirl
            Target      Object
            Match       PortalObject
            When        Always
            Kind        Particle
            System      RoomAmbPortalSwirl
            MaxDistance 40
            Priority    8
            Reduced     yes
        [/Effect]

        [Effect]
            Name        PortalGlow
            Target      Object
            Match       PortalObject
            When        Always
            Kind        Particle
            System      RoomAmbPortalGlow
            Flicker     0.1
            Speed       0.7
            MaxDistance 36
            Priority    7
        [/Effect]

        [Effect]
            Name        PortalSparks
            Target      Object
            Match       PortalObject
            When        Always
            Kind        Particle
            System      RoomAmbPortalSparks
            MaxDistance 30
            Priority    6
        [/Effect]

        # Finished: a flash of light and sparks when a creature arrives
        [Effect]
            Name        PortalArrivalFlash
            Target      Event
            Event       CreatureArrived
            Match       portalRoom portalWaveRoom
            Kind        Particle
            System      RoomAmbPortalFlash
            Duration    2.0
            MaxDistance 40
            Reduced     yes
        [/Effect]

        [Effect]
            Name        PortalArrivalSparks
            Target      Event
            Event       CreatureArrived
            Match       portalRoom portalWaveRoom
            Kind        Particle
            System      RoomAmbSparkBurst
            Offset      0 0 0.5
            Duration    1.5
            MaxDistance 40
        [/Effect]

        ##### Wooden bridges #####

        # Idle: the bridge rocks a little, dust sifts down, and the lava or water below shows
        [Effect]
            Name        WoodBridgeRock
            Target      Tile
            Match       bridge:WoodBridge
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        1 0 0
            Amount      0.4
            Speed       0.3
            MaxDistance 24
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WoodBridgeDust
            Target      Tile
            Match       bridge:WoodBridge
            When        Always
            Kind        Particle
            System      RoomAmbDummyDust
            Offset      0 0 0.2
            Spacing     3
            MaxDistance 16
            Priority    1
        [/Effect]

        # Idle: a few specks of old wood float over the planks
        [Effect]
            Name        WoodBridgeMotes
            Target      Tile
            Match       bridge:WoodBridge
            When        Always
            Kind        Particle
            System      RoomAmbMotes
            Offset      0 0 0.4
            Spacing     5
            MaxDistance 14
            Priority    1
        [/Effect]

        # In operation: the bridge creaks and sways when stepped on, dust and splinters fall
        [Effect]
            Name        WoodBridgeSway
            Target      Tile
            Match       bridge:WoodBridge
            When        Occupied
            Kind        Motion
            Motion      Sway
            Axis        1 0 0
            Amount      1.6
            Speed       1.3
            MaxDistance 24
            Priority    5
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WoodBridgeSplinters
            Target      Tile
            Match       bridge:WoodBridge
            When        Occupied
            Kind        Particle
            System      RoomAmbDebris
            MaxDistance 16
            Priority    3
        [/Effect]

        ##### Stone bridges #####

        # Idle: now and then a fleck of stone falls
        [Effect]
            Name        StoneBridgePebbles
            Target      Tile
            Match       bridge:StoneBridge
            When        Always
            Kind        Particle
            System      RoomAmbPebbleFall
            Spacing     3
            MaxDistance 16
            Priority    1
        [/Effect]

        [Effect]
            Name        StoneBridgeDust
            Target      Tile
            Match       bridge:StoneBridge
            When        Always
            Kind        Particle
            System      RoomAmbDummyDust
            Offset      0 0 0.25
            Spacing     4
            MaxDistance 14
            Priority    1
        [/Effect]

        # Idle: now and then the cut stone glints
        [Effect]
            Name        StoneBridgeGlint
            Target      Tile
            Match       bridge:StoneBridge
            When        Always
            Kind        Particle
            System      RoomAmbSeamGlint
            Offset      0 0 0.2
            Spacing     5
            MaxDistance 12
            Priority    1
        [/Effect]

        # In operation: dust crumbles when stepped on
        [Effect]
            Name        StoneBridgeCrumble
            Target      Tile
            Match       bridge:StoneBridge
            When        Occupied
            Kind        Particle
            System      RoomAmbHitDust
            Offset      0 0 0.1
            MaxDistance 18
            Priority    4
        [/Effect]

        ##### Under bridges #####

        [Effect]
            Name        BridgeLavaEmbers
            Target      Tile
            Match       bridge:lavaGround
            When        Always
            Kind        Particle
            System      RoomAmbLavaEmbers
            Spacing     2
            MaxDistance 22
            Priority    3
        [/Effect]

        [Effect]
            Name        BridgeLavaPool
            Target      Tile
            Match       bridge:lavaGround
            When        Always
            Kind        Particle
            System      RoomAmbLavaPool
            Flicker     0.2
            Speed       0.8
            Spacing     3
            MaxDistance 24
            Priority    3
            Reduced     yes
        [/Effect]

        [Effect]
            Name        BridgeWaterGlint
            Target      Tile
            Match       bridge:waterGround
            When        Always
            Kind        Particle
            System      RoomAmbWaterGlint
            Spacing     2
            MaxDistance 20
            Priority    2
        [/Effect]

        [Effect]
            Name        BridgeWaterMist
            Target      Tile
            Match       bridge:waterGround
            When        Always
            Kind        Particle
            System      RoomAmbWaterMist
            Spacing     3
            MaxDistance 22
            Priority    2
            Reduced     yes
        [/Effect]

        ##### Doors #####

        # Idle: the lock glints, dust in the frame, the door creaks in its hinges
        [Effect]
            Name        DoorLockGlint
            Target      Object
            Match       WoodenDoor Door*
            When        Always
            Kind        Particle
            System      RoomAmbGoldGlint
            Offset      0.4 0 0.65
            MaxDistance 16
            Priority    2
        [/Effect]

        [Effect]
            Name        DoorFrameDust
            Target      Object
            Match       WoodenDoor Door*
            When        Always
            Kind        Particle
            System      RoomAmbDummyDust
            Offset      0 0 0.4
            MaxDistance 12
            Priority    1
        [/Effect]

        [Effect]
            Name        DoorCreak
            Target      Object
            Match       WoodenDoor Door*
            When        Always
            Kind        Motion
            Motion      Sway
            Axis        0 0 1
            Amount      0.3
            Speed       0.3
            MaxDistance 18
            Priority    1
        [/Effect]

        # In operation: dust and a shaking door when someone passes
        [Effect]
            Name        DoorPassing
            Target      Object
            Match       WoodenDoor Door*
            When        Occupied
            Kind        Motion
            Motion      Wobble
            Axis        0 0 1
            Amount      2.5
            Speed       1.2
            MaxDistance 18
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        DoorPassingDust
            Target      Object
            Match       WoodenDoor Door*
            When        Occupied
            Kind        Particle
            System      RoomAmbHitDust
            Offset      0 0 0.1
            MaxDistance 14
            Priority    3
        [/Effect]

        ##### Traps #####

        # Idle: a glint on the spikes and a red light for a trap that is ready
        [Effect]
            Name        SpikeTrapGlint
            Target      Object
            Match       trap:Spike
            When        Always
            Kind        Particle
            System      RoomAmbIronGlint
            Offset      0 0 0.1
            MaxDistance 16
            Priority    2
        [/Effect]

        [Effect]
            Name        SpikeTrapArmed
            Target      Object
            Match       trap:Spike
            When        Ready
            Kind        Particle
            System      RoomAmbArmedGlow
            Offset      0.4 0.4 0.15
            Flicker     0.4
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        CannonFuse
            Target      Object
            Match       Cannon
            When        Ready
            Kind        Particle
            System      RoomAmbArmedGlow
            Offset      0 0.2 0.65
            Flicker     0.5
            MaxDistance 16
            Priority    2
        [/Effect]

        [Effect]
            Name        CannonSmoke
            Target      Object
            Match       Cannon
            When        Always
            Kind        Particle
            System      RoomAmbSteam
            Offset      0 -0.8 0.5
            MaxDistance 12
            Priority    1
        [/Effect]

        [Effect]
            Name        BoulderGrit
            Target      Object
            Match       Boulder
            When        Ready
            Kind        Particle
            System      RoomAmbDummyDust
            Offset      0 0 0.9
            MaxDistance 12
            Priority    1
        [/Effect]

        [Effect]
            Name        BoulderRumble
            Target      Object
            Match       Boulder
            When        Ready
            Kind        Motion
            Motion      Wobble
            Axis        1 0 0
            Amount      0.4
            Speed       1.0
            MaxDistance 18
            Priority    1
        [/Effect]

        # In operation: a creature close to a trap makes it flare up
        [Effect]
            Name        TrapWarningFlare
            Target      Object
            Match       trap:Spike Cannon Boulder
            When        Occupied
            Kind        Particle
            System      RoomAmbSparkBurst
            Offset      0 0 0.3
            MaxDistance 16
            Priority    4
        [/Effect]
    [/Effects]
[/RoomAmbience]
