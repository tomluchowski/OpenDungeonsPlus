# Dungeonbook appearance: composed creature pictures (neutral base plus one part per slot).
#
# Format: line based, columns separated by TAB, '#' starts a comment.
# Missing or bad entries fall back to the defaults in the code and are logged once.
#
#   AssetRoot          Folder that holds one sub folder per catalog id with its manifest.cfg.
#                      A relative path is resolved against the game data path.
#   MaxCachedPictures  Number of composed pictures kept at the same time (least recently used go first).
#   MaxCacheMegabytes  Memory limit of the composed pictures.
#
AssetRoot	materials/portraits/variants
MaxCachedPictures	64
MaxCacheMegabytes	64
